<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>هیئت زوارالزهرا | بازی‌های حافظه و پازل</title>
  <!--
    ============================================================
    پروژه: مجموعه بازی‌های تعاملی (حافظه + پازل)
    نسخه: 12.0 — تاریخ: 2026-06-10
    اصلاحات:
      - کارت‌های متنی: فقط عنوان نمایش داده شود (بدون توضیحات)
      - جفت نادرست: لرزش + حاشیه قرمز، سپس flip سه‌بعدی (بدون محو)
      - جفت درست: فقط حاشیه سبز درخشان (بدون تیک)
      - سایر بخش‌ها بدون تغییر
    ویژگی‌های پایدار:
      - صفحه خانه، لینک‌ها، تم تاریک/روشن خودکار
      - حافظه 16/20/24 کارتی با چیدمان واکنش‌گرا
      - پازل 3×3/4×4/5×5 (بدون انیمیشن حرکت)
      - موسیقی، افکت‌های صوتی، رکوردها، ذرات شادی
    ============================================================
  -->
  <style>
    /* ================================================================
       CSS Custom Properties (متغیرهای طراحی)
       ================================================================ */
    :root {
      --font-main: 'Yekan', 'Vazirmatn', 'Tahoma', sans-serif;
      --font-fallback: 'YekanFallback', sans-serif;
      --bg-body: #faf7f0;
      --bg-surface: #ffffff;
      --bg-card-back: #fdf8f0;
      --text-dark: #2c2416;
      --text-soft: #5c4a2e;
      --text-on-primary: #ffffff;
      --gold-dark: #8b6508;
      --gold: #d4af37;
      --gold-light: #f9e076;
      --gold-pale: #f7efd2;
      --maroon: #3d1c1c;
      --maroon-light: #5a2a2a;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.07);
      --shadow-md: 0 8px 28px rgba(0,0,0,0.13);
      --shadow-lg: 0 14px 40px rgba(0,0,0,0.19);
      --border-gold: #e8dbb8;
      --radius-card: 16px;
      --radius-btn: 50px;
      --transition-flip: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.3s ease;
      --card-aspect-ratio: 4 / 5;
      --card-max-width: 170px;
      --logo-url: url('source/logo2.png');
      /* رنگ‌های جدید برای بازخورد */
      --color-correct: #2ecc71;
      --color-wrong: #e74c3c;
    }

    /* ================================================================
       @font-face — فونت Yekan از پوشه source
       ================================================================ */
    @font-face {
      font-family: 'Yekan';
      src: url('source/Yekan.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'YekanFallback';
      src: local('Tahoma');
      font-display: swap;
    }

    /* ================================================================
       Reset سراسری
       ================================================================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      font-family: var(--font-main), var(--font-fallback);
      background: linear-gradient(145deg, #faf7f0 0%, #f5edd8 50%, #faf7f0 100%);
      background-attachment: fixed;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 16px;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
      overflow-x: hidden; position: relative;
      color: var(--text-dark); line-height: 1.5;
      transition: background 0.3s, color 0.3s;
    }

    /* الگوی تزئینی پس‌زمینه */
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(30,74,74,0.025) 1px, transparent 1px),
        radial-gradient(circle at 80% 70%, rgba(139,101,8,0.035) 1.5px, transparent 1.5px);
      background-size: 60px 60px, 90px 90px;
      pointer-events: none; z-index: 0;
    }

    .screen {
      position: relative; z-index: 2; width: 100%; max-width: 960px;
      display: flex; flex-direction: column; align-items: center; gap: 24px;
    }
    .screen.hidden { display: none !important; }

    /* ================================================================
       صفحه خانه
       ================================================================ */
    #homeScreen { justify-content: center; min-height: 90vh; min-height: 90dvh; }
    .home-header { text-align: center; margin-bottom: 8px; }
    .home-title {
      font-size: 2.8rem; font-weight: 900; color: var(--maroon);
      text-shadow: 2px 2px 0px var(--gold-light); margin-bottom: 12px; line-height: 1.4;
    }
    .home-subtitle {
      font-size: 1.15rem; color: var(--text-soft); margin-bottom: 24px; font-weight: 500;
    }
    .home-subtitle strong { color: var(--maroon); font-weight: 800; }
    .btn-group { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 340px; align-items: center; margin-bottom: 24px; }

    .home-links {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      justify-content: center; max-width: 400px; position: relative;
      padding-top: 20px; margin-top: 8px;
    }
    .home-links::before {
      content: ""; position: absolute; top: 0; left: 10%; width: 80%; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      opacity: 0.5;
    }
    .home-link {
      color: var(--maroon); text-decoration: none; font-weight: 700; font-size: 0.95rem;
      padding: 8px 16px; border-radius: 24px; background: var(--bg-surface);
      border: 1px solid var(--gold-pale); transition: all var(--transition-smooth);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .home-link:hover { background: var(--gold-pale); border-color: var(--gold); transform: translateY(-1px); }

    /* ================================================================
       دکمه‌های عمومی
       ================================================================ */
    .btn {
      background: linear-gradient(135deg, var(--maroon), var(--maroon-light));
      color: var(--text-on-primary); border: 2px solid var(--gold);
      padding: 18px 32px; border-radius: var(--radius-btn);
      font-family: inherit; font-size: 1.2rem; font-weight: 700;
      cursor: pointer; box-shadow: 0 10px 24px rgba(61,28,28,0.35);
      transition: all var(--transition-smooth); text-align: center;
      position: relative; overflow: hidden; width: 100%;
    }
    .btn::before {
      content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: rotate(45deg); animation: btnShine 4s infinite;
    }
    @keyframes btnShine { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }
    .btn:hover { background: linear-gradient(135deg, #5a2a2a, #3d1c1c); box-shadow: 0 14px 32px rgba(61,28,28,0.5); transform: translateY(-2px); }
    .btn:active { transform: scale(0.97); }

    .btn-control {
      background: var(--bg-surface); border: 2px solid var(--gold);
      color: var(--maroon); font-family: inherit; font-weight: 700;
      font-size: 1rem; padding: 12px 28px; border-radius: var(--radius-btn);
      cursor: pointer; box-shadow: var(--shadow-sm);
      transition: background var(--transition-smooth), border-color var(--transition-smooth);
      margin-top: 8px;
    }
    .btn-control:hover { background: #fdf8f0; border-color: var(--maroon); }

    .selector-btn {
      background: var(--bg-surface); border: 2px solid var(--gold);
      color: var(--maroon); padding: 14px 28px; border-radius: 30px;
      font-weight: 700; font-family: inherit; font-size: 1rem;
      cursor: pointer; transition: all var(--transition-smooth); min-width: 170px;
    }
    .selector-btn:hover { background: var(--gold-pale); border-color: var(--maroon); transform: translateY(-1px); }

    /* ================================================================
       هدر بازی‌ها
       ================================================================ */
    .game-header { width: 100%; text-align: center; margin-bottom: 8px; }
    .org-name {
      font-size: 1.5rem; font-weight: 900; color: var(--maroon);
      display: inline-block; background: var(--bg-surface); padding: 8px 28px;
      border-radius: 40px; box-shadow: var(--shadow-sm); border: 1px solid var(--gold-light);
    }

    /* ================================================================
       نوار آمار
       ================================================================ */
    .stats-bar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 12px 0; }
    .stat-item {
      background: var(--bg-surface); border-radius: 14px; padding: 10px 18px;
      display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.9rem;
      color: var(--text-dark); box-shadow: var(--shadow-sm); border: 1px solid var(--border-gold);
    }
    .stat-value { font-weight: 900; color: var(--maroon); min-width: 28px; text-align: center; }

    /* ================================================================
       گرید بازی حافظه
       ================================================================ */
    .memory-grid {
      display: grid; gap: 10px; width: 100%; justify-items: center;
      align-items: center; margin: 8px 0 24px;
    }
    .memory-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .memory-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }

    /* ================================================================
       کارت حافظه
       ================================================================ */
    .card-container {
      perspective: 1200px;
      width: 100%;
      max-width: var(--card-max-width);
      aspect-ratio: var(--card-aspect-ratio);
      cursor: pointer;
      position: relative;
      animation: fadeInCard 0.5s ease both;
      will-change: transform;
      border-radius: var(--radius-card);
      transition: border-color 0.2s;
    }
    @keyframes fadeInCard {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
    .card-container.no-click { pointer-events: none; }

    /* بازخورد جفت درست – فقط حاشیه سبز بدون تیک */
    .card-container.matched {
      border: 3px solid var(--color-correct) !important;
      box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.4), 0 0 20px rgba(46, 204, 113, 0.3);
      pointer-events: none;
      border-radius: var(--radius-card);
    }
    /* حذف کامل تیک (::after) */
    .card-container.matched::after {
      content: none !important;
      display: none !important;
    }

    /* لرزش و حاشیه قرمز برای جفت نادرست */
    .card-container.wrong-highlight {
      border: 3px solid var(--color-wrong) !important;
      box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.5);
      animation: shakeCard 0.4s ease-in-out;
      border-radius: var(--radius-card);
    }
    @keyframes shakeCard {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-6px); }
      50%  { transform: translateX(6px); }
      75%  { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform var(--transition-flip);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-md);
    }
    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius-card);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* پشت کارت */
    .card-back {
      background-color: var(--bg-card-back);
      border: 3px solid var(--gold);
      box-shadow: inset 0 0 15px rgba(0,0,0,0.06), 0 0 10px rgba(212,175,55,0.25);
      z-index: 2;
    }
    .card-back svg { width: 100%; height: 100%; display: block; }
    .card-container:hover .card-back {
      box-shadow: inset 0 0 20px rgba(0,0,0,0.12), 0 0 18px rgba(249,224,118,0.5);
      transition: all 0.3s ease;
    }

    /* روی کارت (فقط تصویر) */
    .card-front {
      background: linear-gradient(160deg, #fffefb, #fdf8ed);
      border: 3px solid var(--border-gold);
      transform: rotateY(180deg);
      padding: 0;
      z-index: 1;
    }
    .card-image-wrapper {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .card-image-wrapper img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid var(--gold);
      display: block;
    }

    /* کارت متنی (فقط عنوان) */
    .card-text-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--maroon);
      padding: 12px;
      text-align: center;
      word-break: break-word;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    /* ================================================================
       پازل
       ================================================================ */
    .puzzle-wrapper { width: 100%; max-width: 420px; aspect-ratio: 1/1; margin: 8px auto; position: relative; }
    .puzzle-grid {
      display: grid; width: 100%; height: 100%; gap: 0;
      border-radius: 12px; overflow: hidden;
      border: 3px solid var(--gold); box-shadow: var(--shadow-lg);
    }
    .puzzle-cell {
      background-size: cover; background-repeat: no-repeat;
      cursor: pointer; position: relative; border: none; outline: none;
    }
    .puzzle-cell.empty { background-image: none !important; background-color: rgba(255,255,255,0.15); cursor: default; }
    .puzzle-cell:not(.empty):hover { box-shadow: inset 0 0 10px rgba(212,175,55,0.5); z-index: 1; }

    .puzzle-preview-btn {
      position: absolute; top: 8px; right: 8px; z-index: 5;
      background: var(--maroon); color: white; border: 2px solid var(--gold);
      border-radius: 50%; width: 40px; height: 40px; font-size: 1.2rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      opacity: 0.85;
    }
    .puzzle-preview-btn:hover { background: var(--maroon-light); opacity: 1; }

    .preview-overlay {
      position: absolute; inset: 0; z-index: 10;
      background: rgba(0,0,0,0.7); display: flex;
      align-items: center; justify-content: center;
      border-radius: 12px; opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .preview-overlay.active { opacity: 1; pointer-events: auto; }
    .preview-overlay img {
      max-width: 90%; max-height: 90%; border-radius: 8px;
      border: 2px solid var(--gold-light);
    }

    /* ================================================================
       دکمه موسیقی
       ================================================================ */
    .music-toggle {
      position: fixed; bottom: 20px; right: 20px; z-index: 300;
      background: var(--maroon); color: white; border: 2px solid var(--gold);
      border-radius: 50%; width: 52px; height: 52px; font-size: 1.5rem;
      cursor: pointer; box-shadow: var(--shadow-md); display: flex;
      align-items: center; justify-content: center; transition: all var(--transition-smooth);
    }
    .music-toggle:hover { background: var(--maroon-light); }
    .music-toggle.playing { background: var(--gold); color: var(--maroon); }

    /* ================================================================
       مدال پایان بازی
       ================================================================ */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px); display: flex;
      align-items: center; justify-content: center; z-index: 200;
      opacity: 0; visibility: hidden; transition: opacity 0.5s, visibility 0.5s;
    }
    .overlay.active { opacity: 1; visibility: visible; }
    .modal {
      background: var(--bg-surface); border-radius: 28px; padding: 28px 24px;
      width: 92%; max-width: 500px; text-align: center;
      box-shadow: 0 30px 70px rgba(0,0,0,0.6); border: 3px solid var(--gold);
      animation: modalPopIn 0.4s ease;
    }
    @keyframes modalPopIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal h2 { color: var(--maroon); margin-bottom: 10px; font-size: 1.4rem; }
    .big-text { font-size: 2.5rem; font-weight: 900; color: var(--gold-dark); margin: 8px 0; }
    .detail-row { display: flex; justify-content: center; gap: 20px; font-size: 0.9rem; color: var(--text-soft); margin: 12px 0; flex-wrap: wrap; }
    .record-badge {
      background: var(--gold-pale); border-radius: 20px; padding: 6px 18px;
      display: inline-block; font-weight: 700; color: var(--maroon); margin: 10px 0;
    }
    .join-link {
      display: inline-block; margin: 6px 0 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--maroon); text-decoration: none; padding: 12px 28px;
      border-radius: 40px; font-weight: 700; font-size: 1rem;
      border: 2px solid var(--maroon-light); transition: all var(--transition-smooth);
    }
    .join-link:hover { background: var(--gold-light); }
    .promo-section { margin: 20px 0 10px; }
    .promo-title { font-weight: 800; color: var(--maroon); margin-bottom: 10px; }
    .promo-links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    .promo-link {
      background: linear-gradient(135deg, var(--maroon), #2c1010); color: white;
      text-decoration: none; padding: 12px 24px; border-radius: 40px; font-weight: 700;
      border: 2px solid var(--gold); transition: all var(--transition-smooth); font-size: 0.95rem;
    }
    .promo-link:hover { background: #5a2a2a; }
    .btn-replay {
      background: var(--gold); color: var(--maroon); border: none;
      padding: 12px 32px; border-radius: 40px; font-weight: 700;
      font-family: inherit; font-size: 1rem; cursor: pointer;
      margin-top: 16px; transition: background var(--transition-smooth);
    }
    .btn-replay:hover { background: var(--gold-light); }

    /* ================================================================
       ذرات شادی (Confetti)
       ================================================================ */
    .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 250; }
    .confetti-piece { position: absolute; animation: confettiFall linear forwards; }
    @keyframes confettiFall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ================================================================
       Dark Mode (تم تاریک)
       ================================================================ */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #121212;
        --bg-surface: #1e1e2f;
        --bg-card-back: #2a2a3a;
        --text-dark: #e0e0e0;
        --text-soft: #b0b0b0;
        --text-on-primary: #ffffff;
        --gold-dark: #b8960c;
        --gold: #c9a84c;
        --gold-light: #a68b2c;
        --gold-pale: #3a3420;
        --maroon: #b85a5a;
        --maroon-light: #8e4040;
        --border-gold: #4a3a20;
        --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
        --shadow-md: 0 8px 28px rgba(0,0,0,0.5);
        --shadow-lg: 0 14px 40px rgba(0,0,0,0.7);
        --logo-url: url('source/logo1.jpg');
      }
      body {
        background: linear-gradient(145deg, #121212 0%, #1a1a2e 50%, #121212 100%);
      }
      body::before {
        background-image:
          radial-gradient(circle at 20% 30%, rgba(255,255,255,0.03) 1px, transparent 1px),
          radial-gradient(circle at 80% 70%, rgba(201,168,76,0.06) 1.5px, transparent 1.5px);
      }
      .btn-control:hover { background: #2a2a3a; }
      .card-front { background: linear-gradient(160deg, #2a2a35, #1e1e2a); }
    }

    /* ================================================================
       واکنش‌گرایی
       ================================================================ */
    @media (max-width: 480px) {
      .home-title { font-size: 2rem; }
      .stat-item { padding: 6px 10px; font-size: 0.75rem; gap: 4px; }
      :root { --card-max-width: 120px; }
      .memory-grid { gap: 6px; }
    }
    @media (max-width: 360px) {
      :root { --card-max-width: 100px; }
      .memory-grid { gap: 4px; }
    }
    @media (min-width: 1024px) {
      body { padding: 30px 24px; }
      .screen { max-width: 1100px; }
      :root { --card-max-width: 200px; }
      .puzzle-wrapper { max-width: 500px; }
      .btn { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <!-- ================================================================
       HTML Structure
       ================================================================ -->

  <!-- صفحه خانه -->
  <div id="homeScreen" class="screen">
    <div class="home-header">
      <div class="home-title">✨ به هیئت زوارالزهرا خوش آمدید</div>
      <div class="home-subtitle">بازی مورد علاقه خود را انتخاب کنید<br><strong>حافظه خود را به چالش بکشید!</strong></div>
    </div>
    <div class="btn-group">
      <button class="btn" id="btnGoMemory">🧠 بازی حافظه</button>
      <button class="btn" id="btnGoPuzzle">🧩 تصویر به هم ریخته</button>
    </div>
    <div class="home-links">
      <a href="https://formafzar.com/form/omi1j" target="_blank" rel="noopener" class="home-link">📝 عضویت</a>
      <a href="https://zovvar.com" target="_blank" rel="noopener" class="home-link">🌐 وب‌سایت</a>
      <a href="https://eitaa.com/zovvaralzahra" target="_blank" rel="noopener" class="home-link">📱 ایتا</a>
    </div>
  </div>

  <!-- صفحه انتخاب تعداد کارت (حافظه) -->
  <div id="memorySelectScreen" class="screen hidden">
    <div class="game-header"><div class="org-name">🎴 انتخاب تعداد کارت</div></div>
    <div class="card-count-selector">
      <p>تعداد جفت‌ها:</p>
      <div class="selector-btns" id="memorySelectBtns"><!-- توسط JS پر می‌شود --></div>
    </div>
    <button class="btn-control" id="btnMemorySelectBack">🏠 بازگشت</button>
  </div>

  <!-- صفحه بازی حافظه -->
  <div id="memoryScreen" class="screen hidden">
    <div class="game-header"><div class="org-name">🏴 هیئت زوارالزهرا</div></div>

      <div class="stat-item">❌ خطا: <span class="stat-value" id="memErrors">۰</span></div>
      <div class="stat-item">⏱ زمان: <span class="stat-value" id="memTimer">۰:۰۰</span></div>
      <div class="stat-item">🃏 جفت مانده: <span class="stat-value" id="memPairsLeft">۰</span></div>

  <!-- صفحه انتخاب ابعاد پازل -->
  <div id="puzzleSelectScreen" class="screen hidden">
    <div class="game-header"><div class="org-name">🧩 انتخاب ابعاد</div></div>
    <div class="card-count-selector"><p>اندازه:</p><div class="selector-btns" id="puzzleSelectBtns"><!-- توسط JS پر می‌شود --></div></div>
    <button class="btn-control" id="btnPuzzleSelectBack">🏠 بازگشت</button>

  <!-- صفحه بازی پازل -->
  <div id="puzzleScreen" class="screen hidden">
    <div class="game-header"><div class="org-name">🧩 تصویر به هم ریخته</div></div>
    <div class="stats-bar">
      <div class="stat-item">⏱ زمان: <span class="stat-value" id="puzTimer">۰:۰۰</span></div>
      <div class="stat-item">🔄 حرکات: <span class="stat-value" id="puzMoves">۰</span></div>
    </div>
    <div class="puzzle-wrapper" id="puzzleWrapper">
      <div id="puzzleGrid" class="puzzle-grid"></div>
      <button class="puzzle-preview-btn" id="puzzlePreviewBtn" title="پیش‌نمایش">🔍</button>
      <div class="preview-overlay" id="previewOverlay"><img id="previewImage" src="" alt="پیش‌نمایش"></div>

  <!-- مدال پایان بازی -->
  <div id="endOverlay" class="overlay"><div id="endModal" class="modal"></div></div>
  <!-- محفظه ذرات شادی -->
  <div id="confettiContainer" class="confetti-wrap"></div>
  <!-- دکمه موسیقی -->
  <button id="musicToggle" class="music-toggle playing">🔊</button>
  <audio id="bgMusic" src="source/mc.mp3" loop preload="auto"></audio>

  <!-- ================================================================
       JavaScript Logic
       ================================================================ -->
  <script>
    (function() {
      // ---------- DOM References ----------
      const screens = {
        home: document.getElementById('homeScreen'),
        memorySelect: document.getElementById('memorySelectScreen'),
        memory: document.getElementById('memoryScreen'),
        puzzleSelect: document.getElementById('puzzleSelectScreen'),
        puzzle: document.getElementById('puzzleScreen')
      };
      const btnGoMemory = document.getElementById('btnGoMemory');
      const btnGoPuzzle = document.getElementById('btnGoPuzzle');
      const btnMemorySelectBack = document.getElementById('btnMemorySelectBack');
      const btnMemoryBack = document.getElementById('btnMemoryBack');
      const btnPuzzleSelectBack = document.getElementById('btnPuzzleSelectBack');
      const btnPuzzleBack = document.getElementById('btnPuzzleBack');
      const memorySelectBtns = document.getElementById('memorySelectBtns');
      const puzzleSelectBtns = document.getElementById('puzzleSelectBtns');
      const endOverlay = document.getElementById('endOverlay');
      const endModal = document.getElementById('endModal');
      const confettiContainer = document.getElementById('confettiContainer');
      const bgMusic = document.getElementById('bgMusic');
      const musicToggle = document.getElementById('musicToggle');
      const puzzlePreviewBtn = document.getElementById('puzzlePreviewBtn');
      const previewOverlay = document.getElementById('previewOverlay');
      const previewImage = document.getElementById('previewImage');

      // ---------- Device Detector ----------
      const DeviceDetector = {
        getDeviceType() {
          const w = window.innerWidth; const max = Math.max(w, window.innerHeight);
          const ua = navigator.userAgent || '';
          if (/Mobi|Android(?!.*Tablet)|iPhone|iPod/i.test(ua) || max < 768) return 'mobile';
          if (/iPad|Tablet|Android(?!.*Mobi)/i.test(ua) || (max >= 768 && max < 1024)) return 'tablet';
          return 'desktop';
        },
        isLandscape() { return window.innerWidth > window.innerHeight; }
      };

      // ---------- Activities Data ----------
      const allActivities = [
        { id:1, title:'راهپیمایی اربعین', desc:'پیاده‌روی عظیم', img:'arbain.jpg' },
        { id:2, title:'اردوی برهان', desc:'علمی فرهنگی', img:'borhan.jpg' },
        { id:3, title:'هیئت هفتگی', desc:'دورهمی معنوی', img:'haftegi.jpg' },
        { id:4, title:'اعتکاف', desc:'سه روز عبادت', img:'itikaf.jpg' },
        { id:5, title:'اردوی مشهد', desc:'زیارت امام رضا', img:'mashhad.jpg' },
        { id:6, title:'محرم و فاطمیه', desc:'عزاداری سنتی', img:'moharam.jpg' },
        { id:7, title:'المپیک تابستانی', desc:'مسابقات ورزشی', img:'olampyc.jpg' },
        { id:8, title:'شب قدر', desc:'احیاء و مناجات', img:'qadr.jpg' },
        { id:9, title:'راهیان نور', desc:'بازدید عملیاتی', img:'rahian.jpg' },
        { id:10, title:'اردوی شمال', desc:'تفریح و نشاط', img:'shomal.jpg' },
        { id:11, title:'کلاس سیره', desc:'آموزه‌های اخلاقی', img:'sire.jpg' },
        { id:12, title:'کمک درسی', desc:'تقویت دروس', img:'clas.jpg' }
      ];

      // ---------- Audio Engine ----------
      let audioCtx = null;
      function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
      function tone(f,d,t='sine',v=0.2,delay=0) { if(!audioCtx) return; try{ const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=t; o.frequency.setValueAtTime(f,audioCtx.currentTime+delay); g.gain.setValueAtTime(v,audioCtx.currentTime+delay); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+delay+d); o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime+delay); o.stop(audioCtx.currentTime+delay+d); }catch(e){} }
      function sfxClick(){ initAudio(); tone(700,0.07); }
      function sfxMatch(){ initAudio(); tone(523,0.1,'sine',0.25,0); tone(659,0.1,'sine',0.25,0.1); }
      function sfxError(){ initAudio(); tone(180,0.15,'triangle',0.12); }
      function sfxWin(){ initAudio(); [523,659,784,1047].forEach((f,i)=>tone(f,0.15,'sine',0.3,i*0.1)); }
      function sfxSlide(){ initAudio(); tone(350,0.08,'sine',0.15); }

      // ---------- Music Controller ----------
      let musicPlaying = true; bgMusic.volume=0.4;
      function updateMusicBtn(){ musicToggle.textContent = musicPlaying ? '🔊' : '🔇'; musicToggle.classList.toggle('playing', musicPlaying); }
      function startMusic(){ initAudio(); bgMusic.play().then(()=>{ musicPlaying=true; updateMusicBtn(); }).catch(()=>{ musicPlaying=false; updateMusicBtn(); }); }
      musicToggle.addEventListener('click', ()=>{ initAudio(); if(musicPlaying){ bgMusic.pause(); musicPlaying=false; } else { bgMusic.play().catch(()=>{}); musicPlaying=true; } updateMusicBtn(); });

      // ---------- Utilities ----------
      const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
      const formatTime = s => `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
      const getBest = k => { try{ return parseInt(localStorage.getItem(k))||0; }catch(e){ return 0; } };
      const setBest = (k,v) => { try{ const cur=getBest(k); if(v>cur){ localStorage.setItem(k,v); return true; } }catch(e){} return false; };
      const spawnConfetti = (n=100) => {
        const colors=['#d4af37','#f9e076','#3d1c1c','#2ecc71','#e74c3c','#3498db'];
        const f=document.createDocumentFragment();
        for(let i=0;i<n;i++){ const p=document.createElement('div'); p.className='confetti-piece'; p.style.left=Math.random()*100+'%'; p.style.top=-(Math.random()*30+10)+'px'; p.style.width=(Math.random()*8+5)+'px'; p.style.height=(Math.random()*8+5)+'px'; p.style.background=colors[Math.floor(Math.random()*colors.length)]; p.style.animationDuration=(Math.random()*2+2)+'s'; f.appendChild(p); }
        confettiContainer.appendChild(f); setTimeout(()=>{ confettiContainer.innerHTML=''; },5000);
      };

      // ---------- Dark Mode & Logo ----------
      const darkModeQuery = window.matchMedia('(prefers-color-scheme: dark)');
      function isDarkMode() { return darkModeQuery.matches; }
      function getLogoUrl() { return isDarkMode() ? 'source/logo1.jpg' : 'source/logo2.png'; }

      // ---------- SVG Card Back (با حاشیه زیبا) ----------
      function generateCardBackSVG() {
        const logo = getLogoUrl();
        const bg = isDarkMode() ? '#2a2a3a' : '#fdf8f0';
        const borderColor = isDarkMode() ? '#c9a84c' : '#d4af37';
        const accentColor = isDarkMode() ? '#a68b2c' : '#e0c878';
        const patternColor = isDarkMode() ? 'rgba(201,168,76,0.2)' : 'rgba(212,175,55,0.25)';
        return `
        <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 250" preserveAspectRatio="xMidYMid meet">
          <defs>
            <pattern id="islimi" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M10 0 L15 5 L20 10 L15 15 L10 20 L5 15 L0 10 L5 5 Z" fill="${patternColor}" />
              <circle cx="10" cy="10" r="2" fill="${accentColor}" opacity="0.6"/>
            </pattern>
            <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="${borderColor}"/>
              <stop offset="100%" stop-color="${accentColor}"/>
            </linearGradient>
          </defs>
          <rect width="200" height="250" fill="${bg}" rx="14"/>
          <rect x="6" y="6" width="188" height="238" fill="none" stroke="url(#borderGrad)" stroke-width="3" rx="10"/>
          <rect x="12" y="12" width="176" height="226" fill="none" stroke="${accentColor}" stroke-width="1.5" stroke-dasharray="6 4" rx="8" opacity="0.8"/>
          <rect x="18" y="18" width="164" height="214" fill="url(#islimi)" rx="6"/>
          <rect x="24" y="24" width="152" height="202" fill="none" stroke="${borderColor}" stroke-width="1.5" rx="4" opacity="0.7"/>
          <path d="M35 35 Q50 25 65 35" fill="none" stroke="${borderColor}" stroke-width="2" opacity="0.9"/>
          <path d="M135 35 Q150 25 165 35" fill="none" stroke="${borderColor}" stroke-width="2" opacity="0.9"/>
          <path d="M35 215 Q50 225 65 215" fill="none" stroke="${borderColor}" stroke-width="2" opacity="0.9"/>
          <path d="M135 215 Q150 225 165 215" fill="none" stroke="${borderColor}" stroke-width="2" opacity="0.9"/>
          <image x="45" y="70" width="110" height="110" xlink:href="${logo}" preserveAspectRatio="xMidYMid meet" opacity="0.95"/>
          <circle cx="45" cy="70" r="4" fill="${borderColor}" opacity="0.5"/>
          <circle cx="155" cy="70" r="4" fill="${borderColor}" opacity="0.5"/>
          <circle cx="45" cy="180" r="4" fill="${borderColor}" opacity="0.5"/>
          <circle cx="155" cy="180" r="4" fill="${borderColor}" opacity="0.5"/>
        </svg>`;
      }

      /** به‌روزرسانی تمام پشت کارت‌ها هنگام تغییر تم */
      function updateAllCardBacks() {
        document.querySelectorAll('.card-back').forEach(back => {
          back.innerHTML = generateCardBackSVG();
        });
      }
      darkModeQuery.addEventListener('change', () => {
        updateAllCardBacks();
      });

      /** تعویض صفحه */
      function showScreen(id) {
        Object.values(screens).forEach(s => s.classList.add('hidden'));
        if (screens[id]) screens[id].classList.remove('hidden');
        endOverlay.classList.remove('active');
      }

      // ============================================================
      //  MemoryGame Class (با اصلاحات جدید)
      // ============================================================
      class MemoryGame {
        constructor() {
          this.pairs = 8;          // پیش‌فرض ۸ جفت (۱۶ کارت)
          this.total = 16;
          this.cols = 4;
          this.cards = [];
          this.flipped = [];
          this.matched = new Set();
          this.attempts = 0;
          this.errors = 0;
          this.sec = 0;
          this.timer = null;
          this.preview = false;
          this.check = false;
          this.active = false;
          this.done = false;

          // DOM elements
          this.grid = document.getElementById('memoryGrid');
          this.attEl = document.getElementById('memAttempts');
          this.errEl = document.getElementById('memErrors');
          this.timEl = document.getElementById('memTimer');
          this.leftEl = document.getElementById('memPairsLeft');
        }

        // به‌روزرسانی آمار
        updateStats() {
          this.attEl.textContent = this.attempts.toLocaleString('fa-IR');
          this.errEl.textContent = this.errors.toLocaleString('fa-IR');
          this.leftEl.textContent = (this.pairs - this.matched.size).toLocaleString('fa-IR');
        }

        // تایمر
        startTimer() {
          if (this.timer) clearInterval(this.timer);
          this.sec = 0;
          this.timEl.textContent = formatTime(0);
          this.timer = setInterval(() => {
            this.sec++;
            this.timEl.textContent = formatTime(this.sec);
          }, 1000);
        }
        stopTimer() {
          if (this.timer) { clearInterval(this.timer); this.timer = null; }
        }

        // تعیین ستون‌های گرید
        determineGrid() {
          const dev = DeviceDetector.getDeviceType();
          if (dev === 'mobile' && !DeviceDetector.isLandscape()) {
            return { cols: 4 }; // موبایل عمودی همیشه ۴ ستون
          } else {
            return this.total <= 16 ? { cols: 4 } : { cols: 5 };
          }
        }

        // ساخت کارت‌ها
        buildCards(acts) {
          const arr = [];
          acts.forEach(a => {
            arr.push({ pairId: a.id, type: 'text', title: a.title, desc: a.desc, img: null });
            arr.push({ pairId: a.id, type: 'image', title: a.title, desc: a.desc, img: 'source/' + a.img });
          });
          return arr;
        }

        // رندر کارت‌ها
        renderGrid(cards) {
          this.grid.innerHTML = '';
          const { cols } = this.determineGrid();
          this.cols = cols;
          this.grid.className = `memory-grid cols-${cols}`;

          // تنظیم اندازه کارت‌ها
          const root = document.documentElement;
          const dev = DeviceDetector.getDeviceType();
          if (dev === 'mobile' && !DeviceDetector.isLandscape()) {
            root.style.setProperty('--card-max-width', this.total >= 20 ? '100px' : '120px');
          } else {
            root.style.setProperty('--card-max-width', '170px');
          }

          cards.forEach((c, i) => {
            const container = document.createElement('div');
            container.className = 'card-container';
            container.dataset.pairId = c.pairId;
            container.dataset.type = c.type;
            container.style.animationDelay = `${i * 0.04}s`;

            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';

            // پشت کارت
            const back = document.createElement('div');
            back.className = 'card-face card-back';
            back.innerHTML = generateCardBackSVG();

            // روی کارت
            const front = document.createElement('div');
            front.className = 'card-face card-front';

            if (c.type === 'image') {
              // کارت تصویری
              front.innerHTML = `
                <div class="card-image-wrapper">
                  <img src="${c.img}" alt="${c.desc}" loading="lazy"
                       onerror="this.parentElement.innerHTML='<div style=\\'padding:16px;color:#888;\\'>تصویر</div>'">
                </div>`;
            } else {
              // کارت متنی: فقط عنوان (بدون توضیحات)
              front.innerHTML = `
                <div class="card-text-content">${c.title}</div>`;
            }

            cardDiv.appendChild(back);
            cardDiv.appendChild(front);
            container.appendChild(cardDiv);
            container.addEventListener('click', () => this.handleClick(container));
            this.grid.appendChild(container);
          });
        }

        // برگرداندن کارت
        flip(cont, show) {
          cont.querySelector('.card').classList.toggle('flipped', show);
        }

        // مدیریت کلیک کارت
        handleClick(cont) {
          if (!this.active || this.done || this.preview || this.check) return;
          if (cont.classList.contains('matched')) return;
          if (cont.querySelector('.card').classList.contains('flipped')) return;
          if (this.flipped.length >= 2) return;

          sfxClick();
          this.flip(cont, true);
          this.flipped.push(cont);

          if (this.flipped.length === 2) {
            this.attempts++;
            this.updateStats();
            this.check = true;

            const [a, b] = this.flipped;
            const isMatch = (a.dataset.pairId === b.dataset.pairId) && (a.dataset.type !== b.dataset.type);

            if (isMatch) {
              // جفت درست: فقط حاشیه سبز (بدون تیک)
              setTimeout(() => {
                sfxMatch();
                a.classList.add('matched');
                b.classList.add('matched');
                this.matched.add(parseInt(a.dataset.pairId));
                this.flipped = [];
                this.check = false;
                this.updateStats();
                if (this.matched.size === this.pairs) this.endGame();
              }, 400);
            } else {
              // جفت نادرست: لرزش + حاشیه قرمز
              this.errors++;
              this.updateStats();
              sfxError();

              // افزودن کلاس wrong-highlight (لرزش + حاشیه قرمز)
              a.classList.add('wrong-highlight');
              b.classList.add('wrong-highlight');

              // پس از پایان لرزش، کارت‌ها را برگردان
              const shakeDuration = 400; // هماهنگ با انیمیشن shakeCard
              setTimeout(() => {
                // برداشتن کلاس wrong-highlight
                a.classList.remove('wrong-highlight');
                b.classList.remove('wrong-highlight');
                // برگرداندن کارت‌ها با flip سه‌بعدی
                this.flip(a, false);
                this.flip(b, false);
                this.flipped = [];
                this.check = false;
              }, shakeDuration);
            }
          }
        }

        // پیش‌نمایش اولیه
        startPreview() {
          this.preview = true;
          this.active = false;
          const all = this.grid.querySelectorAll('.card-container');
          all.forEach(c => this.flip(c, true));
          const duration = this.total >= 24 ? 4000 : 3000;
          setTimeout(() => {
            all.forEach(c => {
              if (!c.classList.contains('matched')) this.flip(c, false);
            });
            this.preview = false;
            this.active = true;
            this.startTimer();
          }, duration);
        }

        // مقداردهی اولیه
        init(pairs) {
          this.pairs = pairs;
          this.total = pairs * 2;
          this.stopTimer();
          this.sec = 0;
          this.timEl.textContent = formatTime(0);
          this.attempts = 0;
          this.errors = 0;
          this.matched.clear();
          this.flipped = [];
          this.check = false;
          this.preview = false;
          this.active = false;
          this.done = false;
          this.updateStats();

          const selected = shuffle(allActivities).slice(0, pairs);
          this.cards = shuffle(this.buildCards(selected));
          this.renderGrid(this.cards);
          setTimeout(() => this.startPreview(), 200);
        }

        // پایان بازی
        endGame() {
          this.done = true;
          this.active = false;
          this.stopTimer();
          const score = Math.max(0, 5000 - this.errors * 70 - this.sec * 4);
          const isNew = setBest('memBest', score);
          endModal.innerHTML = `
            <div style="font-size:3rem;">🏆</div>
            <h2>آفرین! شما با موفقیت تمام جفت‌ها را پیدا کردید</h2>
            <div class="big-text">${score.toLocaleString('fa-IR')}</div>
            <div class="detail-row">
              <span>❌ خطا: <strong>${this.errors.toLocaleString('fa-IR')}</strong></span>
              <span>⏱ زمان: <strong>${formatTime(this.sec)}</strong></span>
              <span>🎯 تلاش: <strong>${this.attempts.toLocaleString('fa-IR')}</strong></span>
            </div>
            <div class="record-badge">${isNew ? '🎉 رکورد جدید!' : `🏅 بهترین رکورد: ${getBest('memBest').toLocaleString('fa-IR')}`}</div>
            <a href="https://formafzar.com/form/omi1j" target="_blank" class="join-link">📝 به ما بپیوندید</a>
            <div class="promo-section">
              <div class="promo-title">با هیئت زوارالزهرا بیشتر آشنا شوید</div>
              <div class="promo-links">
                <a href="https://zovvar.com" target="_blank" class="promo-link">🌐 وب‌سایت</a>
                <a href="https://eitaa.com/zovvaralzahra" target="_blank" class="promo-link">📱 ایتا</a>
              </div>
            </div>
            <button class="btn-replay" id="btnMemReplay">🔄 بازی دوباره</button>
          `;
          endOverlay.classList.add('active');
          sfxWin();
          spawnConfetti();
          document.getElementById('btnMemReplay').addEventListener('click', () => {
            endOverlay.classList.remove('active');
            this.init(this.pairs);
          });
        }

        destroy() { this.stopTimer(); }
      }

      // ============================================================
      //  PuzzleGame Class (پازل بدون انیمیشن)
      // ============================================================
      class PuzzleGame {
        constructor() {
          this.size = 3;
          this.empty = 8;
          this.tiles = [];
          this.moves = 0;
          this.sec = 0;
          this.timer = null;
          this.active = false;
          this.done = false;
          this.img = '';
          this.grid = document.getElementById('puzzleGrid');
          this.timEl = document.getElementById('puzTimer');
          this.movEl = document.getElementById('puzMoves');
          this._longTimer = null;
          this._down = false;
        }

        updateStats() {
          this.movEl.textContent = this.moves.toLocaleString('fa-IR');
          this.timEl.textContent = formatTime(this.sec);
        }

        startTimer() {
          if (!this.timer) this.timer = setInterval(() => { this.sec++; this.timEl.textContent = formatTime(this.sec); }, 1000);
        }
        stopTimer() { if (this.timer) { clearInterval(this.timer); this.timer = null; } }

        renderGrid() {
          this.grid.innerHTML = '';
          this.grid.style.gridTemplateColumns = `repeat(${this.size}, 1fr)`;
          this.grid.style.gridTemplateRows = `repeat(${this.size}, 1fr)`;
          const total = this.size * this.size;
          for (let pos = 0; pos < total; pos++) {
            const cell = document.createElement('div');
            cell.className = 'puzzle-cell';
            cell.dataset.pos = pos;
            const tile = this.tiles[pos];
            if (tile === this.empty) {
              cell.classList.add('empty');
            } else {
              const row = Math.floor(tile / this.size), col = tile % this.size;
              cell.style.backgroundImage = `url(${this.img})`;
              cell.style.backgroundSize = `${this.size * 100}%`;
              cell.style.backgroundPosition = `${col * (100 / (this.size - 1))}% ${row * (100 / (this.size - 1))}%`;
              cell.addEventListener('click', () => this.handleCell(cell));
            }
            this.grid.appendChild(cell);
          }
        }

        findEmpty() { return this.tiles.indexOf(this.empty); }
        isAdjacent(p1, p2) {
          const r1 = Math.floor(p1 / this.size), c1 = p1 % this.size;
          const r2 = Math.floor(p2 / this.size), c2 = p2 % this.size;
          return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
        }

        handleCell(cell) {
          if (!this.active || this.done) return;
          const pos = parseInt(cell.dataset.pos);
          const emp = this.findEmpty();
          if (!this.isAdjacent(pos, emp)) return;
          sfxSlide();
          [this.tiles[pos], this.tiles[emp]] = [this.tiles[emp], this.tiles[pos]];
          this.moves++;
          this.updateStats();
          this.startTimer();
          this.renderGrid();
          if (this.checkWin()) this.endGame();
        }

        checkWin() { for (let i = 0; i < this.tiles.length; i++) if (this.tiles[i] !== i) return false; return true; }

        shuffle() {
          this.tiles = [...Array(this.size * this.size).keys()];
          this.empty = this.size * this.size - 1;
          for (let i = 0; i < 200; i++) {
            const emp = this.findEmpty();
            const moves = [];
            const r = Math.floor(emp / this.size), c = emp % this.size;
            if (r > 0) moves.push(emp - this.size);
            if (r < this.size - 1) moves.push(emp + this.size);
            if (c > 0) moves.push(emp - 1);
            if (c < this.size - 1) moves.push(emp + 1);
            const t = moves[Math.floor(Math.random() * moves.length)];
            [this.tiles[emp], this.tiles[t]] = [this.tiles[t], this.tiles[emp]];
          }
        }

        init(size) {
          this.size = size;
          this.empty = size * size - 1;
          this.stopTimer(); this.sec = 0; this.moves = 0;
          this.active = true; this.done = false;
          this.updateStats();
          const act = allActivities[Math.floor(Math.random() * allActivities.length)];
          this.img = 'source/' + act.img;
          previewImage.src = this.img;
          this.shuffle(); this.renderGrid();
          previewOverlay.classList.remove('active');
        }

        endGame() {
          this.active = false; this.done = true; this.stopTimer();
          const best = getBest(`puzBest_${this.size}`);
          let isNew = false;
          if (best === 0 || this.sec < best) { setBest(`puzBest_${this.size}`, this.sec); isNew = true; }
          endModal.innerHTML = `
            <div style="font-size:3rem;">🧩</div>
            <h2>تبریک! شما تصویر را به درستی کامل کردید</h2>
            <div class="detail-row">
              <span>⏱ زمان: <strong>${formatTime(this.sec)}</strong></span>
              <span>🔄 حرکات: <strong>${this.moves.toLocaleString('fa-IR')}</strong></span>
            </div>
            <div class="record-badge">${isNew ? '🎉 رکورد جدید!' : `🏅 بهترین زمان: ${formatTime(getBest(`puzBest_${this.size}`))}`}</div>
            <a href="https://formafzar.com/form/omi1j" target="_blank" class="join-link">📝 به ما بپیوندید</a>
            <div class="promo-section">
              <div class="promo-title">با هیئت زوارالزهرا بیشتر آشنا شوید</div>
              <div class="promo-links">
                <a href="https://zovvar.com" target="_blank" class="promo-link">🌐 وب‌سایت</a>
                <a href="https://eitaa.com/zovvaralzahra" target="_blank" class="promo-link">📱 ایتا</a>
              </div>
            </div>
            <button class="btn-replay" id="btnPuzReplay">🔄 بازی دوباره</button>
          `;
          endOverlay.classList.add('active');
          sfxWin(); spawnConfetti();
          document.getElementById('btnPuzReplay').addEventListener('click', () => { endOverlay.classList.remove('active'); this.init(this.size); });
        }

        showPreview() { previewOverlay.classList.add('active'); }
        hidePreview() { previewOverlay.classList.remove('active'); }
        setupPreview() {
          puzzlePreviewBtn.addEventListener('mouseenter', () => { if (!this._down) this.showPreview(); });
          puzzlePreviewBtn.addEventListener('mouseleave', () => { if (!this._down) this.hidePreview(); });
          const start = (e) => { e.preventDefault(); this._down = true; this._longTimer = setTimeout(() => this.showPreview(), 500); };
          const cancel = () => { this._down = false; if (this._longTimer) { clearTimeout(this._longTimer); this._longTimer = null; } this.hidePreview(); };
          puzzlePreviewBtn.addEventListener('touchstart', start, { passive: false });
          puzzlePreviewBtn.addEventListener('touchend', cancel);
          puzzlePreviewBtn.addEventListener('touchcancel', cancel);
          puzzlePreviewBtn.addEventListener('mousedown', start);
          puzzlePreviewBtn.addEventListener('mouseup', cancel);
          previewOverlay.addEventListener('click', () => this.hidePreview());
        }
      }

      // ---------- نمونه‌های بازی ----------
      const memoryGame = new MemoryGame();
      const puzzleGame = new PuzzleGame();
      puzzleGame.setupPreview();

      // ---------- پر کردن انتخاب‌ها ----------
      function populateMemorySelectors() {
        memorySelectBtns.innerHTML = '';
        [8, 10, 12].forEach(p => {
          const btn = document.createElement('button');
          btn.className = 'selector-btn';
          btn.textContent = `${p} جفت (${p * 2} کارت)`;
          btn.addEventListener('click', () => { showScreen('memory'); memoryGame.init(p); });
          memorySelectBtns.appendChild(btn);
        });
      }

      function populatePuzzleSelectors() {
        puzzleSelectBtns.innerHTML = '';
        [3, 4, 5].forEach(s => {
          const btn = document.createElement('button');
          btn.className = 'selector-btn';
          btn.textContent = `${s}×${s}`;
          btn.addEventListener('click', () => { showScreen('puzzle'); puzzleGame.init(s); });
          puzzleSelectBtns.appendChild(btn);
        });
      }

      // ---------- رویدادهای کلی ----------
      btnGoMemory.addEventListener('click', () => { initAudio(); populateMemorySelectors(); showScreen('memorySelect'); });
      btnGoPuzzle.addEventListener('click', () => { initAudio(); populatePuzzleSelectors(); showScreen('puzzleSelect'); });
      btnMemorySelectBack.addEventListener('click', () => showScreen('home'));
      btnPuzzleSelectBack.addEventListener('click', () => showScreen('home'));
      btnMemoryBack.addEventListener('click', () => { memoryGame.destroy(); showScreen('home'); });
      btnPuzzleBack.addEventListener('click', () => { puzzleGame.stopTimer(); showScreen('home'); });
      endOverlay.addEventListener('click', (e) => { if (e.target === endOverlay) endOverlay.classList.remove('active'); });
      document.body.addEventListener('click', initAudio, { once: true });
      document.body.addEventListener('touchstart', initAudio, { once: true });

      // ---------- شروع برنامه ----------
      showScreen('home');
      updateMusicBtn();
      startMusic();
    })();
  </script>
</body>
