<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>هیئت زوارالزهرا | بازی‌های حافظه و پازل</title>
  <!--
    ============================================================
    پروژه: مجموعه بازی‌های تعاملی (حافظه + پازل)
    نسخه: 6.0 — تاریخ: 2026-06-09
    ویژگی‌های کلیدی:
      • صفحه خانه با دو گزینه
      • بازی حافظه با قابلیت انتخاب ۸، ۱۲ یا ۲۴ کارت بسته به دستگاه
      • تشخیص خودکار نوع دستگاه (موبایل/تبلت/دسکتاپ) و orientation
      • چیدمان افقی در landscape بدون تغییر شکل کارت‌ها
      • طرح پشت کارت با SVG اسلیمی + لوگوی هیئت (logo2.png)
      • فونت Yekan.ttf از پوشه source
      • موسیقی پس‌زمینه پیش‌فرض روشن (mc.mp3)
      • بازی پازل ۳×۳ با انیمیشن حرکت روان قطعات
      • افکت‌های صوتی متنوع با Web Audio API
      • ذرات شادی (confetti) در پایان بازی
      • کاملاً واکنش‌گرا و بدون کتابخانه خارجی
    ============================================================
  -->
  <style>
    /* ================================================================
       CSS Custom Properties
       ================================================================ */
    :root {
      /* فونت */
      --font-main: 'Yekan', 'Vazirmatn', 'Tahoma', sans-serif;
      --font-fallback: 'YekanFallback', sans-serif;

      /* رنگ‌ها */
      --bg-body: #faf7f0;
      --surface: #ffffff;
      --text-dark: #2c2416;
      --text-soft: #5c4a2e;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.07);
      --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.13);
      --shadow-lg: 0 14px 40px rgba(0, 0, 0, 0.19);
      --shadow-gold: 0 0 20px rgba(212, 175, 55, 0.55);
      --gold-dark: #8b6508;
      --gold: #d4af37;
      --gold-light: #f9e076;
      --gold-pale: #f7efd2;
      --maroon: #3d1c1c;
      --maroon-light: #5a2a2a;
      --teal: #1e4a4a;

      /* ابعاد */
      --radius-card: 16px;
      --radius-btn: 50px;
      --transition-flip: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.3s ease;
      --puzzle-transition: 0.28s cubic-bezier(0.25, 0.1, 0.25, 1);

      /* نسبت کارت (ثابت، در landscape تغییر نمی‌کند) */
      --card-aspect-ratio: 4 / 5;
    }

    /* ================================================================
       @font-face — بارگذاری فونت Yekan از پوشه source
       ================================================================ */
    @font-face {
      font-family: 'Yekan';
      src: url('source/Yekan.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'YekanFallback';
      src: local('Tahoma');
      font-display: swap;
    }

    /* ================================================================
       Reset سراسری
       ================================================================ */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-main), var(--font-fallback);
      background: linear-gradient(145deg, #faf7f0 0%, #f5edd8 50%, #faf7f0 100%);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      overflow-x: hidden;
      position: relative;
      color: var(--text-dark);
      line-height: 1.5;
    }

    /* الگوی تزئینی پس‌زمینه */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(30, 74, 74, 0.025) 1px, transparent 1px),
        radial-gradient(circle at 80% 70%, rgba(139, 101, 8, 0.035) 1.5px, transparent 1.5px);
      background-size: 60px 60px, 90px 90px;
      pointer-events: none;
      z-index: 0;
    }

    /* ================================================================
       مدیریت صفحات
       ================================================================ */
    .screen {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .screen.hidden {
      display: none !important;
    }

    /* ================================================================
       صفحه خانه
       ================================================================ */
    #homeScreen {
      justify-content: center;
      min-height: 90vh;
      min-height: 90dvh;
    }
    .home-header {
      text-align: center;
      margin-bottom: 8px;
    }
    .home-title {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--maroon);
      text-shadow: 2px 2px 0px var(--gold-light);
      margin-bottom: 12px;
      text-align: center;
      line-height: 1.4;
    }
    .home-subtitle {
      font-size: 1.15rem;
      color: var(--text-soft);
      margin-bottom: 32px;
      text-align: center;
      font-weight: 500;
    }
    .home-subtitle strong {
      color: var(--maroon);
      font-weight: 800;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 340px;
      align-items: center;
    }

    /* ================================================================
       دکمه‌های عمومی
       ================================================================ */
    .btn {
      background: linear-gradient(135deg, var(--maroon), var(--maroon-light));
      color: white;
      border: 2px solid var(--gold);
      padding: 18px 32px;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(61, 28, 28, 0.35);
      transition: all var(--transition-smooth);
      text-align: center;
      position: relative;
      overflow: hidden;
      width: 100%;
    }
    .btn::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      transform: rotate(45deg);
      animation: btnShine 4s infinite;
    }
    @keyframes btnShine {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }
    .btn:hover {
      background: linear-gradient(135deg, #5a2a2a, #3d1c1c);
      box-shadow: 0 14px 32px rgba(61, 28, 28, 0.5);
      transform: translateY(-2px);
    }
    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 5px 12px rgba(61, 28, 28, 0.4);
    }

    /* دکمه‌های کنترلی */
    .btn-control {
      background: var(--surface);
      border: 2px solid var(--gold);
      color: var(--maroon);
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      padding: 12px 28px;
      border-radius: var(--radius-btn);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background var(--transition-smooth), border-color var(--transition-smooth);
      margin-top: 8px;
    }
    .btn-control:hover {
      background: #fdf8f0;
      border-color: var(--maroon);
    }

    /* دکمه‌های انتخاب */
    .selector-btn {
      background: var(--surface);
      border: 2px solid var(--gold);
      color: var(--maroon);
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: 700;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      transition: all var(--transition-smooth);
      min-width: 170px;
    }
    .selector-btn:hover {
      background: var(--gold-pale);
      border-color: var(--maroon);
      transform: translateY(-1px);
    }
    .selector-btn.recommended {
      border-color: var(--gold);
      background: var(--gold-pale);
      font-size: 1.05rem;
    }

    /* ================================================================
       هدر بازی‌ها
       ================================================================ */
    .game-header {
      width: 100%;
      text-align: center;
      margin-bottom: 8px;
    }
    .org-name {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--maroon);
      display: inline-block;
      background: var(--surface);
      padding: 8px 28px;
      border-radius: 40px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gold-light);
    }

    /* ================================================================
       نوار آمار
       ================================================================ */
    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 12px 0;
    }
    .stat-item {
      background: var(--surface);
      border-radius: 14px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-dark);
      box-shadow: var(--shadow-sm);
      border: 1px solid #e8dbb8;
    }
    .stat-value {
      font-weight: 900;
      color: var(--maroon);
      min-width: 28px;
      text-align: center;
    }

    /* ================================================================
       صفحه انتخاب تعداد کارت
       ================================================================ */
    #memorySelectScreen {
      justify-content: center;
      min-height: 80vh;
      min-height: 80dvh;
    }
    .card-count-selector {
      text-align: center;
      margin: 24px 0;
    }
    .card-count-selector p {
      font-weight: 700;
      color: var(--maroon);
      margin-bottom: 16px;
      font-size: 1.1rem;
    }
    .selector-btns {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ================================================================
       گرید بازی حافظه
       ================================================================ */
    .memory-grid {
      display: grid;
      gap: 14px;
      width: 100%;
      justify-items: center;
      align-items: center;
      margin: 8px 0 24px;
      transition: all var(--transition-smooth);
    }
    /* کلاس‌های تعداد ستون (توسط JS تنظیم می‌شود) */
    .memory-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .memory-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .memory-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .memory-grid.cols-6 { grid-template-columns: repeat(6, 1fr); }

    /* ================================================================
       کارت حافظه
       ================================================================ */
    .card-container {
      perspective: 1200px;
      width: 100%;
      max-width: 170px;
      aspect-ratio: var(--card-aspect-ratio);
      cursor: pointer;
      position: relative;
      animation: fadeInCard 0.5s ease both;
      will-change: transform;
    }
    @keyframes fadeInCard {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
    .card-container.no-click {
      pointer-events: none;
    }
    .card-container.matched {
      filter: drop-shadow(0 0 10px rgba(46, 204, 113, 0.7));
      border-radius: var(--radius-card);
    }
    .card-container.matched::after {
      content: "✓";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      color: #2ecc71;
      z-index: 5;
      pointer-events: none;
      animation: checkPop 0.4s ease;
      text-shadow: 0 0 8px rgba(46, 204, 113, 0.8);
    }
    @keyframes checkPop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      60% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform var(--transition-flip);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-md);
    }
    .card.flipped {
      transform: rotateY(180deg);
    }

    /* ================================================================
       وجه‌های کارت
       ================================================================ */
    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius-card);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* پشت کارت */
    .card-back {
      background-color: var(--maroon);
      border: 4px solid var(--gold);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(212, 175, 55, 0.5);
      z-index: 2;
    }
    .card-back svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .card-container:hover .card-back {
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(249, 224, 118, 0.8);
      transition: all 0.3s ease;
    }

    /* روی کارت */
    .card-front {
      background: linear-gradient(160deg, #fffefb, #fdf8ed);
      border: 3px solid #e8dbb8;
      transform: rotateY(180deg);
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      text-align: center;
      z-index: 1;
    }
    .card-front.image-only {
      padding: 6px;
    }
    .card-image-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
      background: #f2ebd9;
      min-height: 0;
    }
    .card-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }
    .card-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--maroon);
      line-height: 1.4;
      flex-shrink: 0;
    }
    .card-desc {
      font-size: 0.7rem;
      color: var(--text-soft);
      font-weight: 500;
      flex-shrink: 0;
    }

    /* ================================================================
       پازل ۳×۳
       ================================================================ */
    .puzzle-wrapper {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      margin: 8px auto;
      position: relative;
    }
    .puzzle-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 100%;
      height: 100%;
      gap: 0;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid var(--gold);
      box-shadow: var(--shadow-lg);
    }
    .puzzle-cell {
      background-size: 300% 300%;
      background-repeat: no-repeat;
      cursor: pointer;
      transition: transform var(--puzzle-transition), box-shadow 0.2s;
      position: relative;
      border: none;
      outline: none;
      will-change: transform;
    }
    .puzzle-cell.empty {
      background-image: none !important;
      background-color: rgba(255, 255, 255, 0.1);
      cursor: default;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
    }
    .puzzle-cell:not(.empty):hover {
      box-shadow: inset 0 0 14px rgba(212, 175, 55, 0.7);
      z-index: 1;
    }
    .puzzle-cell:not(.empty):active {
      transform: scale(0.95);
    }

    /* ================================================================
       دکمه موسیقی
       ================================================================ */
    .music-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 300;
      background: var(--maroon);
      color: white;
      border: 2px solid var(--gold);
      border-radius: 50%;
      width: 52px;
      height: 52px;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-smooth);
      padding: 0;
    }
    .music-toggle:hover {
      background: var(--maroon-light);
      box-shadow: var(--shadow-gold);
    }
    .music-toggle.playing {
      background: var(--gold);
      color: var(--maroon);
    }

    /* ================================================================
       مدال پایان بازی
       ================================================================ */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s, visibility 0.5s;
    }
    .overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal {
      background: #fffefb;
      border-radius: 28px;
      padding: 28px 24px;
      width: 92%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
      border: 3px solid var(--gold);
      animation: modalPopIn 0.4s ease;
    }
    @keyframes modalPopIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal h2 {
      color: var(--maroon);
      margin-bottom: 10px;
      font-size: 1.4rem;
    }
    .big-text {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--gold-dark);
      margin: 8px 0;
    }
    .detail-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 0.9rem;
      color: var(--text-soft);
      margin: 12px 0;
      flex-wrap: wrap;
    }
    .record-badge {
      background: var(--gold-pale);
      border-radius: 20px;
      padding: 6px 18px;
      display: inline-block;
      font-weight: 700;
      color: var(--maroon);
      margin: 10px 0;
    }
    .promo-section {
      margin: 20px 0 10px;
    }
    .promo-section .promo-title {
      font-weight: 800;
      color: var(--maroon);
      margin-bottom: 10px;
    }
    .promo-links {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .promo-link {
      background: linear-gradient(135deg, var(--maroon), #2c1010);
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 700;
      border: 2px solid var(--gold);
      transition: all var(--transition-smooth);
      font-size: 0.95rem;
    }
    .promo-link:hover {
      background: #5a2a2a;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
    }
    .btn-replay {
      background: var(--gold);
      color: var(--maroon);
      border: none;
      padding: 12px 32px;
      border-radius: 40px;
      font-weight: 700;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 16px;
      transition: background var(--transition-smooth), box-shadow var(--transition-smooth);
    }
    .btn-replay:hover {
      background: var(--gold-light);
      box-shadow: var(--shadow-gold);
    }

    /* ================================================================
       ذرات شادی (Confetti)
       ================================================================ */
    .confetti-wrap {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 250;
    }
    .confetti-piece {
      position: absolute;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ================================================================
       واکنش‌گرایی
       ================================================================ */
    @media (max-width: 480px) {
      .home-title { font-size: 2rem; }
      .home-subtitle { font-size: 0.95rem; }
      .stat-item { padding: 8px 12px; font-size: 0.8rem; gap: 4px; }
      .stat-value { min-width: 22px; }
      .modal { padding: 20px 16px; }
      .big-text { font-size: 2rem; }
      .btn { padding: 14px 24px; font-size: 1rem; }
    }
    @media (max-width: 360px) {
      body { padding: 12px 8px; }
      .memory-grid { gap: 8px; }
      .card-title { font-size: 0.75rem; }
      .card-desc { font-size: 0.65rem; }
    }

    /* ================================================================
       تنظیمات مخصوص دسکتاپ (بزرگ‌تر شدن عناصر)
       ================================================================ */
    @media (min-width: 1024px) {
      body { padding: 30px 24px; }
      .screen { max-width: 1100px; }
      .card-container { max-width: 200px; }
      .memory-grid { gap: 20px; }
      .puzzle-wrapper { max-width: 480px; }
      .btn { font-size: 1.3rem; padding: 20px 36px; }
      .btn-control { font-size: 1.1rem; padding: 14px 32px; }
      .stat-item { font-size: 1rem; padding: 12px 22px; }
      .org-name { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <!-- ================================================================
       HTML Structure
       ================================================================ -->

  <!-- صفحه خانه -->
  <div id="homeScreen" class="screen">
    <div class="home-header">
      <div class="home-title">✨ به هیئت زوارالزهرا خوش آمدید</div>
      <div class="home-subtitle">
        بازی مورد علاقه خود را انتخاب کنید<br>
        <strong>حافظه خود را به چالش بکشید!</strong>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn" id="btnGoMemory">🧠 بازی حافظه</button>
      <button class="btn" id="btnGoPuzzle">🧩 تصویر به هم ریخته</button>
    </div>
  </div>

  <!-- صفحه انتخاب تعداد کارت -->
  <div id="memorySelectScreen" class="screen hidden">
    <div class="game-header">
      <div class="org-name">🎴 انتخاب نوع بازی</div>
    </div>
    <div class="card-count-selector">

  <script>
    (function() {

      const endModal = document.getElementById('endModal');

      const bgMusic = document.getElementById('bgMusic');
      const musicToggle = document.getElementById('musicToggle');

      // ==============================================================
      // Device Detector
      // ==============================================================
      const DeviceDetector = {
        getDeviceType() {
          const ua = navigator.userAgent || '';
          const width = window.innerWidth;
          const maxDim = Math.max(width, window.innerHeight);
          const isMobileUA = /Mobi|Android(?!.*Tablet)|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
          const isTabletUA = /iPad|Tablet|Android(?!.*Mobi)|PlayBook|Silk/i.test(ua);
          if (isMobileUA || maxDim < 768) return 'mobile';
          if (isTabletUA || (maxDim >= 768 && maxDim < 1024)) return 'tablet';
          return 'desktop';
        },
        getOrientation() {
          if (window.screen && window.screen.orientation) {
            return window.screen.orientation.type.includes('landscape') ? 'landscape' : 'portrait';
          }
          return window.innerWidth > window.innerHeight ? 'landscape' : 'portrait';
        },
        isLandscape() { return this.getOrientation() === 'landscape'; },
        isPortrait() { return this.getOrientation() === 'portrait'; }
      };

      // ==============================================================
      // Activity Data (افزودن کلاس‌های کمک درسی)
      // ==============================================================
      const allActivities = [
        { id: 1, title: 'راهپیمایی اربعین', desc: 'پیاده‌روی عظیم اربعین', img: 'arbain.jpg' },

        { id: 5, title: 'اردوی مشهد', desc: 'زیارت امام رضا (ع)', img: 'mashhad.jpg' },
        { id: 6, title: 'محرم و فاطمیه', desc: 'عزاداری سنتی', img: 'moharam.jpg' },
        { id: 7, title: 'المپیک تابستانی', desc: 'مسابقات ورزشی', img: 'olampyc.jpg' },
        { id: 8, title: 'شب قدر', desc: 'احیاء و مناجات', img: 'qadr.jpg' },

        { id: 10, title: 'اردوی شمال', desc: 'تفریح و نشاط', img: 'shomal.jpg' },
        { id: 11, title: 'کلاس سیره و اخلاق', desc: 'آموزه‌های اخلاقی', img: 'sire.jpg' },
        { id: 12, title: 'کلاس‌های کمک درسی', desc: 'تقویت دروس مدرسه', img: 'clas.jpg' }

      // ==============================================================
      // Audio Utilities
      // ==============================================================
      let audioCtx = null;
      function initAudioContext() {
        if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      function playTone(f, d, t = 'sine', v = 0.2, delay = 0) {
        if (!audioCtx) return;
        try {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = t;
          o.frequency.setValueAtTime(f, audioCtx.currentTime + delay);
          g.gain.setValueAtTime(v, audioCtx.currentTime + delay);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + d);
          o.connect(g);
          g.connect(audioCtx.destination);
          o.start(audioCtx.currentTime + delay);
          o.stop(audioCtx.currentTime + delay + d);
        } catch (e) {}
      }

      function soundClick() { initAudioContext();
        playTone(700, 0.07); }

      function soundMatch() { initAudioContext();
        playTone(523, 0.1, 'sine', 0.25, 0);
        playTone(659, 0.1, 'sine', 0.25, 0.1);
        playTone(784, 0.15, 'sine', 0.22, 0.2); }

      function soundError() { initAudioContext();
        playTone(180, 0.18, 'triangle', 0.12);
        playTone(140, 0.15, 'triangle', 0.1, 0.08); }

      function soundWin() { initAudioContext(); [523, 659, 784, 1047, 784, 1047].forEach((f, i) => playTone(f, 0.18, 'sine', 0.3, i *
          0.12)); }

      function soundSlide() { initAudioContext();
        playTone(350, 0.08, 'sine', 0.15); }

      function soundPreview() { initAudioContext();
        playTone(440, 0.06, 'sine', 0.1, 0);
        playTone(550, 0.06, 'sine', 0.1, 0.08); }

      // ==============================================================
      // Music Control (پیش‌فرض روشن)
      // ==============================================================
      let musicPlaying = true;
      bgMusic.volume = 0.4;

      function updateMusicButton() {
        musicToggle.textContent = musicPlaying ? '🔊' : '🔇';
        musicToggle.classList.toggle('playing', musicPlaying);
      }

      function startMusic() {
        initAudioContext();
        bgMusic.play().then(() => {
          musicPlaying = true;
          updateMusicButton();
        }).catch(() => {
          musicPlaying = false;
          updateMusicButton();
          console.warn('پخش خودکار موسیقی ممکن نشد. با کلیک روی دکمه موسیقی آن را روشن کنید.');
        });
      }

      function toggleMusic() {
        initAudioContext();
        if (musicPlaying) {
          bgMusic.pause();
          musicPlaying = false;
        } else {
          bgMusic.play().then(() => {
            musicPlaying = true;
          }).catch(() => {});
          musicPlaying = true;
        }
        updateMusicButton();
      }

      musicToggle.addEventListener('click', toggleMusic);

      // ==============================================================
      // Utility Functions
      // ==============================================================
      function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function formatTime(sec) {
        const m = Math.floor(sec / 60),
          s = sec % 60;
        return `${m}:${s.toString().padStart(2, '0')}`;
      }

      function getBestScore(key) {
        try { return parseInt(localStorage.getItem(key)) || 0; } catch (e) { return 0; }
      }

      function setBestScore(key, score) {
        try {
          const cur = getBestScore(key);
          if (score > cur) { localStorage.setItem(key, score); return true; }
          return false;
        } catch (e) { return false; }
      }

      // ==============================================================
      // SVG Card Back (طرح اسلیمی + لوگوی هیئت)
      // ==============================================================
      function generateCardBackSVG() {
        return `
        <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
             viewBox="0 0 200 250" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">

            </linearGradient>
            <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">

            </linearGradient>
            <pattern id="islimiPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
              <path d="M12 0 C16 4, 18 8, 12 12 C8 8, 6 4, 12 0 Z" fill="#d4af37" opacity="0.3"/>
              <path d="M12 24 C16 20, 18 16, 12 12 C8 16, 6 20, 12 24 Z" fill="#d4af37" opacity="0.3"/>

          </defs>
          <rect width="200" height="250" fill="url(#innerGrad)" rx="14"/>
          <rect x="5" y="5" width="190" height="240" fill="none" stroke="url(#goldGrad)" stroke-width="4" rx="12"/>
          <rect x="11" y="11" width="178" height="228" fill="none" stroke="#d4af37" stroke-width="1.5" rx="9" opacity="0.7"/>
          <rect x="14" y="14" width="172" height="222" fill="url(#islimiPattern)" rx="7"/>

          <!-- لوگوی هیئت در مرکز -->
          <image x="55" y="80" width="90" height="90"

                 opacity="0.9"/>
          <!-- نقوش تزئینی گوشه‌ها -->
          <path d="M30 30 Q50 20 60 35" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
          <path d="M170 30 Q150 20 140 35" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
          <path d="M30 220 Q50 230 60 215" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
          <path d="M170 220 Q150 230 140 215" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
          <circle cx="35" cy="35" r="3" fill="#f9e076" opacity="0.6"/>
          <circle cx="165" cy="35" r="3" fill="#f9e076" opacity="0.6"/>
          <circle cx="35" cy="215" r="3" fill="#f9e076" opacity="0.6"/>

      }

      // ==============================================================
      // Confetti Spawner
      // ==============================================================
      function spawnConfetti(count = 120) {
        const colors = ['#d4af37', '#f9e076', '#3d1c1c', '#2ecc71', '#e74c3c', '#3498db', '#f39c12', '#9b59b6'];

        for (let i = 0; i < count; i++) {
          const p = document.createElement('div');

          p.style.background = colors[Math.floor(Math.random() * colors.length)];
          p.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
          p.style.animationDuration = (Math.random() * 2.5 + 2.5) + 's';
          p.style.animationDelay = Math.random() * 1.2 + 's';

      // ==============================================================
      // Screen Manager
      // ==============================================================
      function showScreen(screenId) {
        Object.values(screens).forEach(s => s.classList.add('hidden'));
        if (screens[screenId]) screens[screenId].classList.remove('hidden');
        endOverlay.classList.remove('active');
      }

      // ==============================================================
      // Memory Game Class
      // ==============================================================
      class MemoryGame {
        constructor() {
          this.pairsCount = 4;
          this.totalCards = 8;
          this.gridCols = 4;
          this.cards = [];
          this.flippedCards = [];
          this.matchedPairs = new Set();
          this.attempts = 0;
          this.errors = 0;
          this.timerSeconds = 0;
          this.timerInterval = null;
          this.isPreviewing = false;
          this.isChecking = false;
          this.gameActive = false;
          this.gameFinished = false;
          this.grid = document.getElementById('memoryGrid');
          this.attemptsEl = document.getElementById('memAttempts');
          this.errorsEl = document.getElementById('memErrors');
          this.timerEl = document.getElementById('memTimer');
          this.pairsLeftEl = document.getElementById('memPairsLeft');
          this._orientationHandler = null;
        }

        updateStats() {
          this.attemptsEl.textContent = this.attempts.toLocaleString('fa-IR');
          this.errorsEl.textContent = this.errors.toLocaleString('fa-IR');
          this.pairsLeftEl.textContent = (this.pairsCount - this.matchedPairs.size).toLocaleString('fa-IR');
        }

        startTimer() {
          if (this.timerInterval) clearInterval(this.timerInterval);
          this.timerSeconds = 0;
          this.timerEl.textContent = formatTime(0);
          this.timerInterval = setInterval(() => { this.timerSeconds++;
            this.timerEl.textContent = formatTime(this.timerSeconds); }, 1000);
        }
        stopTimer() { if (this.timerInterval) { clearInterval(this.timerInterval);
            this.timerInterval = null; } }

        determineGridColumns() {
          const deviceType = DeviceDetector.getDeviceType();
          const isLandscape = DeviceDetector.isLandscape();
          const totalCards = this.totalCards;
          if (deviceType === 'mobile') {
            return isLandscape ? Math.min(4, totalCards / 2) : 2;
          } else if (deviceType === 'tablet') {
            if (isLandscape) return totalCards >= 24 ? 6 : (totalCards >= 12 ? 4 : 4);
            else return totalCards >= 24 ? 4 : (totalCards >= 12 ? 3 : 3);
          } else {
            if (isLandscape) return totalCards >= 24 ? 6 : 4;
            else return totalCards >= 24 ? 4 : 4;
          }
        }

        buildCards(activities) {
          const cards = [];
          activities.forEach(act => {
            cards.push({ pairId: act.id, type: 'text', title: act.title, desc: '', img: null });
            cards.push({ pairId: act.id, type: 'image', title: '', desc: act.desc, img: 'source/' + act.img });
          });
          return cards;
        }

        renderGrid(cards) {
          this.grid.innerHTML = '';
          this.gridCols = this.determineGridColumns();
          this.grid.className = `memory-grid cols-${this.gridCols}`;
          cards.forEach((c, i) => {
            const container = document.createElement('div');
            container.className = 'card-container';
            container.dataset.pairId = c.pairId;
            container.dataset.type = c.type;
            container.dataset.index = i;
            container.style.animationDelay = `${i * 0.05}s`;
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            const back = document.createElement('div');
            back.className = 'card-face card-back';
            back.innerHTML = generateCardBackSVG();
            const front = document.createElement('div');
            front.className = 'card-face card-front';
            if (c.type === 'image') {
              front.classList.add('image-only');
              front.innerHTML = `
                <div class="card-image-wrapper">
                  <img src="${c.img}" alt="${c.desc}" loading="lazy"
                       onerror="this.parentElement.innerHTML='<div style=\\'padding:16px;color:#888;text-align:center;\\'>📷<br>تصویر<br>در دسترس نیست</div>'">
                </div>
                <div class="card-desc">${c.desc}</div>`;
            } else {
              front.innerHTML = `
                <div class="card-title" style="flex:1; display:flex; align-items:center; justify-content:center; font-size:1.1rem;">
                  ${c.title}
                </div>`;
            }
            cardDiv.appendChild(back);
            cardDiv.appendChild(front);
            container.appendChild(cardDiv);
            container.addEventListener('click', () => this.handleCardClick(container));
            this.grid.appendChild(container);
          });
        }

        flipCard(cont, up) { cont.querySelector('.card').classList.toggle('flipped', up); }

        handleCardClick(cont) {
          if (!this.gameActive || this.gameFinished || this.isPreviewing || this.isChecking) return;
          if (cont.classList.contains('matched') || cont.querySelector('.card').classList.contains('flipped')) return;
          if (this.flippedCards.length >= 2) return;
          soundClick();
          this.flipCard(cont, true);
          this.flippedCards.push(cont);
          if (this.flippedCards.length === 2) {
            this.attempts++;
            this.updateStats();
            this.isChecking = true;
            const [a, b] = this.flippedCards;
            if (a.dataset.pairId === b.dataset.pairId && a.dataset.type !== b.dataset.type) {
              setTimeout(() => {
                soundMatch();
                a.classList.add('matched');
                b.classList.add('matched');
                this.matchedPairs.add(parseInt(a.dataset.pairId));
                this.flippedCards = [];
                this.isChecking = false;
                this.updateStats();
                if (this.matchedPairs.size === this.pairsCount) this.endGame();
              }, 400);
            } else {
              this.errors++;
              this.updateStats();
              setTimeout(() => {
                soundError();
                this.flipCard(a, false);
                this.flipCard(b, false);
                this.flippedCards = [];
                this.isChecking = false;
              }, 900);
            }
          }
        }

        startPreview() {
          this.isPreviewing = true;
          this.gameActive = false;
          const allContainers = this.grid.querySelectorAll('.card-container');
          allContainers.forEach(c => this.flipCard(c, true));
          soundPreview();
          const previewDuration = this.totalCards >= 24 ? 4000 : 2800;
          setTimeout(() => {
            allContainers.forEach(c => { if (!c.classList.contains('matched')) this.flipCard(c, false); });
            this.isPreviewing = false;
            this.gameActive = true;
            this.startTimer();
          }, previewDuration);
        }

        init(pairs) {
          this.pairsCount = pairs || 4;
          this.totalCards = this.pairsCount * 2;
          this.stopTimer();
          this.timerSeconds = 0;
          this.timerEl.textContent = formatTime(0);
          this.attempts = 0;
          this.errors = 0;
          this.matchedPairs.clear();
          this.flippedCards = [];
          this.isChecking = false;
          this.isPreviewing = false;
          this.gameActive = false;
          this.gameFinished = false;
          this.updateStats();
          const selected = shuffleArray(allActivities).slice(0, this.pairsCount);
          this.cards = shuffleArray(this.buildCards(selected));
          this.renderGrid(this.cards);
          this.setupOrientationListener();
          setTimeout(() => this.startPreview(), 200);
        }

        setupOrientationListener() {
          if (this._orientationHandler) {
            window.removeEventListener('resize', this._orientationHandler);
            if (window.matchMedia) {
              const mq = window.matchMedia('(orientation: portrait)');
              mq.removeEventListener('change', this._orientationHandler);
            }
          }
          this._orientationHandler = () => {
            if (this.gameActive || this.isPreviewing) {
              const newCols = this.determineGridColumns();
              if (newCols !== this.gridCols) {
                this.gridCols = newCols;
                this.grid.className = `memory-grid cols-${this.gridCols}`;
              }
            }
          };
          window.addEventListener('resize', this._orientationHandler);
          if (window.matchMedia) {
            const mq = window.matchMedia('(orientation: portrait)');
            mq.addEventListener('change', this._orientationHandler);
          }
        }

        endGame() {
          this.gameFinished = true;
          this.gameActive = false;
          this.stopTimer();
          if (this._orientationHandler) {
            window.removeEventListener('resize', this._orientationHandler);
            this._orientationHandler = null;
          }
          const score = Math.max(0, 5000 - this.errors * 70 - this.timerSeconds * 4);
          const isNewBest = setBestScore('memoryBestScore', score);
          const bestEver = getBestScore('memoryBestScore');
          endModal.innerHTML = `
            <div style="font-size:3rem;">🏆</div>
            <h2>آفرین! همه جفت‌ها پیدا شد</h2>
            <div class="big-text">${score.toLocaleString('fa-IR')}</div>
            <div class="detail-row">
              <span>❌ خطا: <strong>${this.errors.toLocaleString('fa-IR')}</strong></span>
              <span>⏱ زمان: <strong>${formatTime(this.timerSeconds)}</strong></span>
              <span>🎯 تلاش: <strong>${this.attempts.toLocaleString('fa-IR')}</strong></span>
            </div>
            <div class="record-badge">${isNewBest ? '🎉 رکورد جدید ثبت شد!' : `🏅 بهترین رکورد: ${bestEver.toLocaleString('fa-IR')}`}</div>
            <div class="promo-section">
              <div class="promo-title">📢 با هیئت زوارالزهرا بیشتر آشنا شوید</div>
              <div class="promo-links">
                <a href="https://zovvar.com" target="_blank" rel="noopener" class="promo-link">🌐 وب‌سایت هیئت</a>
                <a href="https://eitaa.com/zovvaralzahra" target="_blank" rel="noopener" class="promo-link">📱 کانال ایتا</a>
              </div>
            </div>
            <button class="btn-replay" id="btnMemoryReplay">🔄 بازی دوباره</button>
          `;
          endOverlay.classList.add('active');
          soundWin();
          spawnConfetti(150);
          const replayBtn = document.getElementById('btnMemoryReplay');
          if (replayBtn) replayBtn.addEventListener('click', () => { endOverlay.classList.remove('active'); this.init(
              this.pairsCount); });
        }

        destroy() {
          this.stopTimer();
          if (this._orientationHandler) {
            window.removeEventListener('resize', this._orientationHandler);
            this._orientationHandler = null;
          }
        }
      }

      // ==============================================================
      // Puzzle Game Class (با انیمیشن اصلاح‌شده)
      // ==============================================================
      class PuzzleGame {
        constructor() {
          this.SIZE = 3;
          this.EMPTY = 8;
          this.tiles = [];
          this.moves = 0;
          this.timerSeconds = 0;
          this.timerInterval = null;
          this.gameActive = false;
          this.gameFinished = false;
          this.currentImage = '';
          this.cells = [];
          this.grid = document.getElementById('puzzleGrid');
          this.timerEl = document.getElementById('puzTimer');
          this.movesEl = document.getElementById('puzMoves');
        }

        updateStats() {
          this.movesEl.textContent = this.moves.toLocaleString('fa-IR');
          this.timerEl.textContent = formatTime(this.timerSeconds);
        }

        startTimer() { if (!this.timerInterval) this.timerInterval = setInterval(() => { this.timerSeconds++;
            this.timerEl.textContent = formatTime(this.timerSeconds); }, 1000); }
        stopTimer() { if (this.timerInterval) { clearInterval(this.timerInterval);
            this.timerInterval = null; } }

        renderGrid() {
          this.grid.innerHTML = '';
          this.cells = [];
          for (let pos = 0; pos < this.tiles.length; pos++) {
            const cell = document.createElement('div');
            cell.className = 'puzzle-cell';
            cell.dataset.pos = pos;
            const tileIndex = this.tiles[pos];
            if (tileIndex === this.EMPTY) {
              cell.classList.add('empty');
            } else {
              const row = Math.floor(tileIndex / this.SIZE);
              const col = tileIndex % this.SIZE;
              cell.style.backgroundImage = `url(${this.currentImage})`;
              cell.style.backgroundSize = '300% 300%';
              cell.style.backgroundPosition = `${col*50}% ${row*50}%`;
              cell.addEventListener('click', () => this.handleCellClick(cell));
            }
            this.grid.appendChild(cell);
            this.cells.push(cell);
          }
        }

        findEmptyPos() { return this.tiles.indexOf(this.EMPTY); }

        isAdjacent(p1, p2) {
          const r1 = Math.floor(p1 / 3),
            c1 = p1 % 3,
            r2 = Math.floor(p2 / 3),
            c2 = p2 % 3;
          return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
        }

        handleCellClick(cell) {
          if (!this.gameActive || this.gameFinished) return;
          const clickedPos = parseInt(cell.dataset.pos);
          const emptyPos = this.findEmptyPos();
          if (!this.isAdjacent(clickedPos, emptyPos)) return;

          soundSlide();

          // محاسبه جابجایی
          const emptyCell = this.cells[emptyPos];
          const cellWidth = cell.offsetWidth;
          const cellHeight = cell.offsetHeight;
          const deltaX = (emptyPos % 3 - clickedPos % 3) * cellWidth;
          const deltaY = (Math.floor(emptyPos / 3) - Math.floor(clickedPos / 3)) * cellHeight;

          // انیمیشن حرکت
          cell.style.transition = 'transform 0.28s cubic-bezier(0.25, 0.1, 0.25, 1)';
          cell.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
          cell.style.zIndex = '2';

          const onTransitionEnd = () => {
            cell.removeEventListener('transitionend', onTransitionEnd);
            // بازنشانی استایل
            cell.style.transition = '';
            cell.style.transform = '';
            cell.style.zIndex = '';

            // جابجایی در آرایه
            [this.tiles[clickedPos], this.tiles[emptyPos]] = [this.tiles[emptyPos], this.tiles[clickedPos]];
            this.moves++;
            this.updateStats();
            if (!this.timerInterval) this.startTimer();

            // بازسازی دو سلول بدون cloneNode
            this.refreshCell(clickedPos);
            this.refreshCell(emptyPos);

            if (this.checkWin()) this.endGame();
          };
          cell.addEventListener('transitionend', onTransitionEnd);
        }

        refreshCell(pos) {
          const oldCell = this.cells[pos];
          const newCell = document.createElement('div');
          newCell.className = 'puzzle-cell';
          newCell.dataset.pos = pos;
          const tileIndex = this.tiles[pos];
          if (tileIndex === this.EMPTY) {
            newCell.classList.add('empty');
          } else {
            const row = Math.floor(tileIndex / this.SIZE);
            const col = tileIndex % this.SIZE;
            newCell.style.backgroundImage = `url(${this.currentImage})`;
            newCell.style.backgroundSize = '300% 300%';
            newCell.style.backgroundPosition = `${col*50}% ${row*50}%`;
            newCell.addEventListener('click', () => this.handleCellClick(newCell));
          }
          oldCell.parentNode.replaceChild(newCell, oldCell);
          this.cells[pos] = newCell;
        }

        checkWin() {
          for (let i = 0; i < this.tiles.length; i++) if (this.tiles[i] !== i) return false;
          return true;
        }

        shuffle() {
          this.tiles = [0, 1, 2, 3, 4, 5, 6, 7, 8];
          for (let i = 0; i < 120; i++) {
            const emptyPos = this.findEmptyPos();
            const moves = [];
            const r = Math.floor(emptyPos / 3),
              c = emptyPos % 3;
            if (r > 0) moves.push(emptyPos - 3);
            if (r < 2) moves.push(emptyPos + 3);
            if (c > 0) moves.push(emptyPos - 1);
            if (c < 2) moves.push(emptyPos + 1);
            const target = moves[Math.floor(Math.random() * moves.length)];
            [this.tiles[emptyPos], this.tiles[target]] = [this.tiles[target], this.tiles[emptyPos]];
          }
        }

        init() {
          this.stopTimer();
          this.timerSeconds = 0;
          this.moves = 0;
          this.gameActive = true;
          this.gameFinished = false;
          this.updateStats();
          const randomAct = allActivities[Math.floor(Math.random() * allActivities.length)];
          this.currentImage = 'source/' + randomAct.img;
          this.shuffle();
          this.renderGrid();
        }

        endGame() {
          this.gameActive = false;
          this.gameFinished = true;
          this.stopTimer();
          const bestTime = getBestScore('puzzleBestTime');
          let isNewBest = false;
          if (bestTime === 0 || this.timerSeconds < bestTime) { setBestScore('puzzleBestTime', this.timerSeconds);
            isNewBest = true; }
          const displayBest = isNewBest ? this.timerSeconds : bestTime;
          endModal.innerHTML = `
            <div style="font-size:3rem;">🧩</div>
            <h2>تبریک! تصویر کامل شد 🎉</h2>
            <div class="detail-row">
              <span>⏱ زمان: <strong>${formatTime(this.timerSeconds)}</strong></span>
              <span>🔄 حرکات: <strong>${this.moves.toLocaleString('fa-IR')}</strong></span>
            </div>
            <div class="record-badge">${isNewBest ? '🎉 رکورد جدید!' : `🏅 بهترین زمان: ${formatTime(displayBest)}`}</div>
            <div class="promo-section">
              <div class="promo-title">📢 با هیئت زوارالزهرا بیشتر آشنا شوید</div>
              <div class="promo-links">
                <a href="https://zovvar.com" target="_blank" rel="noopener" class="promo-link">🌐 وب‌سایت هیئت</a>
                <a href="https://eitaa.com/zovvaralzahra" target="_blank" rel="noopener" class="promo-link">📱 کانال ایتا</a>
              </div>
            </div>
            <button class="btn-replay" id="btnPuzzleReplay">🔄 بازی دوباره</button>
          `;
          endOverlay.classList.add('active');
          soundWin();
          spawnConfetti(100);
          const replayBtn = document.getElementById('btnPuzzleReplay');
          if (replayBtn) replayBtn.addEventListener('click', () => { endOverlay.classList.remove('active'); this.init(); });
        }
      }

      // ==============================================================
      // Initialize Games
      // ==============================================================
      const memoryGame = new MemoryGame();
      const puzzleGame = new PuzzleGame();

      // ==============================================================
      // Available Pair Options
      // ==============================================================
      function getAvailablePairOptions() {
        const deviceType = DeviceDetector.getDeviceType();
        if (deviceType === 'desktop' || deviceType === 'tablet') {
          return [
            { pairs: 4, label: '۴ جفت (۸ کارت)', cssClass: '' },
            { pairs: 6, label: '۶ جفت (۱۲ کارت)', cssClass: '' },
            { pairs: 12, label: '۱۲ جفت (۲۴ کارت)', cssClass: 'recommended' }
          ];
        } else {
          return [
            { pairs: 4, label: '۴ جفت (۸ کارت)', cssClass: '' },
            { pairs: 6, label: '۶ جفت (۱۲ کارت)', cssClass: '' }
          ];
        }
      }

      function populateSelectorButtons() {
        selectorBtnsContainer.innerHTML = '';
        const options = getAvailablePairOptions();
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'selector-btn ' + (opt.cssClass || '');
          btn.dataset.pairs = opt.pairs;
          btn.textContent = opt.label;
          btn.addEventListener('click', (e) => {
            const pairs = parseInt(e.target.dataset.pairs);
            showScreen('memory');
            memoryGame.init(pairs);
          });
          selectorBtnsContainer.appendChild(btn);
        });
      }

      // ==============================================================
      // Event Listeners
      // ==============================================================
      btnGoMemory.addEventListener('click', () => {
        initAudioContext();
        populateSelectorButtons();
        showScreen('memorySelect');
      });

      btnGoPuzzle.addEventListener('click', () => {
        initAudioContext();
        showScreen('puzzle');
        puzzleGame.init();
      });

      btnMemorySelectBack.addEventListener('click', () => showScreen('home'));
      btnMemoryBack.addEventListener('click', () => { memoryGame.destroy();
        showScreen('home'); });
      btnPuzzleBack.addEventListener('click', () => { puzzleGame.stopTimer();
        showScreen('home'); });

      endOverlay.addEventListener('click', (e) => { if (e.target === endOverlay) endOverlay.classList.remove('active'); });

      // فعال‌سازی صدا با اولین تعامل
      document.body.addEventListener('click', initAudioContext, { once: true });
      document.body.addEventListener('touchstart', initAudioContext, { once: true });

      // ==============================================================
      // Orientation Change Handler
      // ==============================================================
      function handleOrientationChange() {
        const deviceType = DeviceDetector.getDeviceType();
        const orientation = DeviceDetector.getOrientation();
        console.log(`[Device] Type: ${deviceType}, Orientation: ${orientation}`);
        if (!screens.memorySelect.classList.contains('hidden')) populateSelectorButtons();
      }

      if (window.matchMedia) {
        const mqPortrait = window.matchMedia('(orientation: portrait)');
        mqPortrait.addEventListener('change', handleOrientationChange);
      }
      window.addEventListener('resize', handleOrientationChange);

      // ==============================================================
      // Initial Setup
      // ==============================================================
      function initializeApp() {
        handleOrientationChange();
        showScreen('home');
        updateMusicButton();
        // تلاش برای پخش خودکار موسیقی
        startMusic();
        console.log('[App] Initialized. Device:', DeviceDetector.getDeviceType(), 'Orientation:', DeviceDetector.getOrientation());
      }

      initializeApp();
    })();
  </script>
