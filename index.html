<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>بازی حافظه | هیئت زوارالزهرا</title>
  <style>
    /* ========== CSS Custom Properties ========== */
    :root {
      --green-dark: #0a2e18;
      --green-mid: #1a4a2a;
      --green-light: #2a6b3a;
      --gold: #c9a84c;
      --gold-light: #e0c878;
      --gold-pale: #f7efd2;
      --bg-body: #faf7f0;
      --surface: #ffffff;
      --text-dark: #2c2416;
      --text-soft: #5c4a2e;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-md: 0 8px 28px rgba(0,0,0,0.14);
      --shadow-gold: 0 0 18px rgba(201,168,76,0.5);
      --radius-card: 16px;
      --radius-btn: 50px;
      --transition-flip: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      --font-main: 'Yekan', 'Vazirmatn', 'Tahoma', sans-serif;
    }

    /* ========== Font Face (Yekan embedded as base64 for full offline) ========== */
    @font-face {
      font-family: 'Yekan';
      src: url('data:font/truetype;base64,AAEAAAASAQAABAAgR0RFRgA...') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    /* Note: The base64 string above is truncated for brevity. 
       In the real file, embed the full Yekan.ttf as base64. 
       I'll include a full data URI placeholder comment. */
    /* Full Yekan.ttf base64 would be here (about 140KB) */
    @font-face {
      font-family: 'YekanFallback';
      src: local('Tahoma');
      font-display: swap;
    }

    /* ========== Global Reset ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-main), 'YekanFallback', sans-serif;
      background: linear-gradient(145deg, #faf7f0 0%, #f5edd8 50%, #faf7f0 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle background pattern */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle at 20% 30%, rgba(26,74,42,0.03) 1px, transparent 1px),
                        radial-gradient(circle at 80% 70%, rgba(201,168,76,0.04) 1.5px, transparent 1.5px);
      background-size: 60px 60px, 90px 90px;
      pointer-events: none;
      z-index: 0;
      animation: bgDrift 30s linear infinite;
    }
    @keyframes bgDrift {
      0% { transform: translate(0,0); }
      100% { transform: translate(30px, 15px); }
    }

    /* ========== Start Screen ========== */
    .start-screen {
      position: fixed;
      inset: 0;
      background: rgba(10, 46, 24, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.6s ease, visibility 0.6s;
      opacity: 1;
      visibility: visible;
    }
    .start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .start-card {
      background: var(--surface);
      border-radius: 28px;
      padding: 36px 24px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      border: 2px solid var(--gold);
      animation: floatIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      position: relative;
      overflow: hidden;
    }
    @keyframes floatIn {
      0% { transform: scale(0.7) translateY(40px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .start-card::before {
      content: "";
      position: absolute;
      top: -40%;
      left: -40%;
      width: 180%;
      height: 180%;
      background: radial-gradient(circle at 30% 30%, rgba(201,168,76,0.08), transparent 60%);
      animation: shineRotate 8s linear infinite;
      pointer-events: none;
    }
    @keyframes shineRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .game-title {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--green-dark);
      margin-bottom: 12px;
      line-height: 1.3;
      position: relative;
    }
    .game-title .icon-memory {
      display: inline-block;
      font-size: 2.5rem;
      animation: pulseIcon 2s infinite;
    }
    @keyframes pulseIcon {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .subtitle {
      font-size: 1.1rem;
      color: var(--text-soft);
      margin-bottom: 28px;
      font-weight: 500;
      line-height: 1.7;
    }
    .btn-start {
      background: linear-gradient(135deg, var(--green-mid), var(--green-dark));
      color: white;
      border: none;
      padding: 16px 48px;
      border-radius: var(--radius-btn);
      font-family: inherit;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(10,46,24,0.45);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      border: 2px solid var(--gold);
      letter-spacing: 1px;
    }
    .btn-start:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(10,46,24,0.6);
    }
    .btn-start:active {
      transform: scale(0.96);
    }
    .btn-start::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: 0.5s;
    }
    .btn-start:hover::after {
      left: 100%;
    }

    /* ========== Header & Stats ========== */
    .game-header {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 700px;
      text-align: center;
      margin-bottom: 16px;
    }
    .org-name {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--green-dark);
      display: inline-block;
      background: var(--surface);
      padding: 8px 24px;
      border-radius: 40px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gold-pale);
    }
    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 16px 0;
      z-index: 2;
      position: relative;
    }
    .stat-item {
      background: var(--surface);
      border-radius: 14px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-dark);
      box-shadow: var(--shadow-sm);
      border: 1px solid #e8dbb8;
    }
    .stat-value {
      font-weight: 900;
      color: var(--green-dark);
      min-width: 28px;
      text-align: center;
    }

    /* ========== Game Grid ========== */
    .game-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      max-width: 680px;
      width: 100%;
      justify-items: center;
      margin: 8px 0 24px;
    }
    @media (max-width: 580px) {
      .game-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
    }

    .card-container {
      perspective: 1200px;
      width: 100%;
      max-width: 155px;
      aspect-ratio: 4 / 5;
      cursor: pointer;
      position: relative;
      animation: cardEntry 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      will-change: transform;
    }
    @keyframes cardEntry {
      0% { opacity: 0; transform: scale(0.6) rotateY(90deg); }
      100% { opacity: 1; transform: scale(1) rotateY(0); }
    }
    .card-container.no-pointer {
      pointer-events: none;
    }
    .card-container.matched {
      filter: drop-shadow(0 0 10px rgba(46,204,113,0.5));
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform var(--transition-flip);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-md);
    }
    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius-card);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ========== Card Back Design (SVG Iran Map + Arabesque) ========== */
    .card-back {
      background: var(--green-dark);
      border: 3px solid var(--green-light);
      z-index: 2;
    }
    .card-back svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Shine effect on back */
    .card-back::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.08) 50%, transparent 60%);
      transform: rotate(25deg);
      animation: cardShine 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes cardShine {
      0%,100% { transform: translateX(-100%) rotate(25deg); }
      50% { transform: translateX(100%) rotate(25deg); }
    }

    /* ========== Card Front ========== */
    .card-front {
      background: linear-gradient(160deg, #fffefb, #fdf8ed);
      border: 3px solid #e8dbb8;
      transform: rotateY(180deg);
      flex-direction: column;
      gap: 4px;
      padding: 12px;
      text-align: center;
      z-index: 1;
    }
    .card-image-wrapper {
      flex: 1.2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
      background: #f2ebd9;
    }
    .card-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--green-dark);
      margin-top: 4px;
      line-height: 1.4;
    }
    .card-desc {
      font-size: 0.7rem;
      color: var(--text-soft);
      font-weight: 500;
      margin-bottom: 2px;
    }

    /* ========== Ripple Effect ========== */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,240,0.7);
      transform: scale(0);
      animation: rippleAnim 0.6s ease-out forwards;
      pointer-events: none;
      z-index: 5;
    }
    @keyframes rippleAnim {
      to { transform: scale(3); opacity: 0; }
    }

    /* ========== Buttons ========== */
    .btn-reset {
      position: relative;
      z-index: 3;
      background: var(--surface);
      border: 2px solid var(--gold);
      color: var(--green-dark);
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      padding: 12px 28px;
      border-radius: var(--radius-btn);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: 0.3s;
      margin-top: 8px;
    }
    .btn-reset:hover {
      background: var(--gold-pale);
      border-color: var(--green-dark);
      box-shadow: var(--shadow-md);
    }

    /* ========== End Overlay ========== */
    .end-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: 0.5s;
    }
    .end-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .end-modal {
      background: #fffefb;
      border-radius: 28px;
      padding: 28px 20px;
      width: 92%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 30px 70px rgba(0,0,0,0.6);
      border: 3px solid var(--gold);
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.5) translateY(30px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .end-score {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--gold);
      margin: 8px 0;
      text-shadow: 0 4px 12px rgba(201,168,76,0.4);
    }
    .end-detail {
      font-size: 0.85rem;
      color: var(--text-soft);
      margin: 6px 0;
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .best-record {
      background: var(--gold-pale);
      border-radius: 20px;
      padding: 6px 18px;
      font-weight: 700;
      color: var(--green-dark);
      display: inline-block;
      margin: 10px 0;
    }
    .promo-section {
      margin: 24px 0 12px;
    }
    .promo-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--green-dark);
      margin-bottom: 14px;
    }
    .promo-links {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .promo-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1.05rem;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, #1a4a2a, #0a2e18);
      border: 2px solid var(--gold);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }
    .promo-btn::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: rotate(45deg);
      animation: btnShine 3s infinite;
    }
    @keyframes btnShine {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }
    .promo-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
    }
    .btn-replay {
      background: var(--gold);
      color: #0a2e18;
      border: none;
      padding: 12px 32px;
      border-radius: 40px;
      font-weight: 700;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 16px;
      transition: 0.3s;
    }
    .btn-replay:hover {
      background: var(--gold-light);
      box-shadow: var(--shadow-gold);
    }

    /* ========== Confetti ========== */
    .confetti-wrap {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 250;
    }
    .confetti-piece {
      position: absolute;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ========== Responsive fine-tuning ========== */
    @media (max-width: 400px) {
      .game-grid { gap: 8px; }
      .card-title { font-size: 0.8rem; }
      .card-desc { font-size: 0.65rem; }
    }
  </style>
</head>
<body>

  <!-- ========== START SCREEN ========== -->
  <div class="start-screen" id="startScreen">
    <div class="start-card">
      <div class="game-title">
        <span class="icon-memory">🧠</span> بازی حافظه
      </div>
      <div class="subtitle">
        ✨ با فعالیت‌های هیئت <strong>زوارالزهرا</strong> آشنا شوید و حافظه خود را به چالش بکشید.
      </div>
      <button class="btn-start" id="btnStartGame">▶ شروع بازی</button>
    </div>
  </div>

  <!-- ========== MAIN GAME UI ========== -->
  <div class="game-header">
    <div class="org-name">🏴 هیئت زوارالزهرا</div>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat-item">🎯 تلاش: <span class="stat-value" id="attemptsDisplay">۰</span></div>
    <div class="stat-item">❌ خطا: <span class="stat-value" id="errorsDisplay">۰</span></div>
    <div class="stat-item">⏱ زمان: <span class="stat-value" id="timerDisplay">۰:۰۰</span></div>
    <div class="stat-item">🃏 جفت مانده: <span class="stat-value" id="pairsLeftDisplay">۴</span></div>
  </div>

  <div class="game-grid" id="gameGrid"></div>

  <button class="btn-reset" id="btnReset">🔄 بازی جدید</button>

  <!-- ========== END OVERLAY ========== -->
  <div class="end-overlay" id="endOverlay">
    <div class="end-modal">
      <div style="font-size:3rem;">🏆</div>
      <h2 style="color:#0a2e18; margin:8px 0;">آفرین! همه جفت‌ها پیدا شد</h2>
      <div class="end-score" id="finalScore">۰</div>
      <div class="end-detail">
        <span>❌ خطا: <strong id="finalErrors">۰</strong></span>
        <span>⏱ زمان: <strong id="finalTime">۰:۰۰</strong></span>
      </div>
      <div class="best-record" id="bestRecordDisplay">🏅 بهترین رکورد: ---</div>

      <div class="promo-section">
        <div class="promo-title">📢 با هیئت بیشتر آشنا شوید</div>
        <div class="promo-links">
          <a href="https://zovvar.com" target="_blank" rel="noopener" class="promo-btn">🌐 سایت هیئت</a>
          <a href="https://eitaa.com/zovvaralzahra" target="_blank" rel="noopener" class="promo-btn">📱 کانال ایتا</a>
        </div>
      </div>
      <button class="btn-replay" id="btnReplay">🔄 بازی دوباره</button>
    </div>
  </div>

  <!-- Confetti container -->
  <div class="confetti-wrap" id="confettiContainer"></div>

  <script>
    (function() {
      // ==================== DOM Elements ====================
      const startScreen = document.getElementById('startScreen');
      const btnStartGame = document.getElementById('btnStartGame');
      const gameGrid = document.getElementById('gameGrid');
      const attemptsDisplay = document.getElementById('attemptsDisplay');
      const errorsDisplay = document.getElementById('errorsDisplay');
      const timerDisplay = document.getElementById('timerDisplay');
      const pairsLeftDisplay = document.getElementById('pairsLeftDisplay');
      const btnReset = document.getElementById('btnReset');
      const endOverlay = document.getElementById('endOverlay');
      const finalScoreEl = document.getElementById('finalScore');
      const finalErrorsEl = document.getElementById('finalErrors');
      const finalTimeEl = document.getElementById('finalTime');
      const bestRecordDisplay = document.getElementById('bestRecordDisplay');
      const btnReplay = document.getElementById('btnReplay');
      const confettiContainer = document.getElementById('confettiContainer');

      // ==================== Game Constants & State ====================
      const PAIRS_PER_GAME = 4;
      const allActivities = [
        { id: 1, title: 'راهپیمایی اربعین', desc: 'پیاده‌روی عظیم اربعین', img: 'arbain.jpg' },
        { id: 2, title: 'اردوی برهان', desc: 'تقویت بنیه علمی و فرهنگی', img: 'borhan.jpg' },
        { id: 3, title: 'هیئت هفتگی', desc: 'دورهمی معنوی هفتگی', img: 'haftegi.jpg' },
        { id: 4, title: 'اعتکاف', desc: 'سه روز عبادت و خودسازی', img: 'itikaf.jpg' },
        { id: 5, title: 'اردوی مشهد', desc: 'زیارت امام رضا (ع)', img: 'mashhad.jpg' },
        { id: 6, title: 'محرم و فاطمیه', desc: 'عزاداری سنتی', img: 'moharam.jpg' },
        { id: 7, title: 'المپیک تابستانی', desc: 'مسابقات ورزشی', img: 'olampyc.jpg' },
        { id: 8, title: 'شب قدر', desc: 'احیاء و مناجات', img: 'qadr.jpg' },
        { id: 9, title: 'راهیان نور', desc: 'بازدید مناطق عملیاتی', img: 'rahian.jpg' },
        { id: 10, title: 'اردوی شمال', desc: 'تفریح و نشاط', img: 'shomal.jpg' },
        { id: 11, title: 'کلاس سیره و اخلاق', desc: 'آموزه‌های اخلاقی', img: 'sire.jpg' }
      ];

      let cardsData = [];               // Current game cards (8 items)
      let flippedCards = [];           // Currently flipped card elements
      let matchedPairs = new Set();    // Set of matched pair IDs
      let attempts = 0;
      let errors = 0;
      let timerSeconds = 0;
      let timerInterval = null;
      let isPreviewActive = false;     // During initial card reveal
      let isChecking = false;         // While two cards are being checked
      let gameActive = false;
      let gameFinished = false;

      // Audio context (lazy)
      let audioCtx = null;

      // ==================== Inline SVG for Card Back ====================
      function generateCardBackSVG() {
        return `
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" preserveAspectRatio="xMidYMid meet">
            <defs>
              <pattern id="islimi" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
                <path d="M7 0 L9 5 L14 7 L9 9 L7 14 L5 9 L0 7 L5 5 Z" fill="#c9a84c" opacity="0.35"/>
              </pattern>
              <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#e0c878"/>
                <stop offset="100%" stop-color="#c9a84c"/>
              </linearGradient>
            </defs>
            <rect width="160" height="200" fill="#0a2e18" rx="12"/>
            <rect x="4" y="4" width="152" height="192" fill="none" stroke="url(#islimi)" stroke-width="6" rx="10"/>
            <rect x="8" y="8" width="144" height="184" fill="none" stroke="url(#goldGrad)" stroke-width="2" rx="8" opacity="0.7"/>
            <!-- Minimal Iran map path (approximate) -->
            <g transform="translate(50, 55) scale(0.9)">
              <path d="M30 5 L38 10 L42 18 L44 28 L40 38 L33 45 L28 42 L24 35 L22 25 L26 14 Z" 
                    fill="#c9a84c" opacity="0.8" stroke="#e0c878" stroke-width="1.5"/>
              <circle cx="32" cy="22" r="2" fill="#fff" opacity="0.7"/>
            </g>
            <circle cx="40" cy="40" r="2.5" fill="#e0c878" opacity="0.4"/>
            <circle cx="120" cy="160" r="2" fill="#e0c878" opacity="0.3"/>
            <path d="M20 20 Q30 18 40 20" fill="none" stroke="#c9a84c" stroke-width="1.8" opacity="0.6"/>
          </svg>`;
      }

      // ==================== Audio Helpers ====================
      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      function playTone(freq, duration, type = 'sine', volume = 0.2, delay = 0) {
        if (!audioCtx) return;
        try {
          const t = audioCtx.currentTime + delay;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(volume, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + duration);
        } catch (e) { /* ignore */ }
      }

      function soundClick() { initAudio(); playTone(700, 0.07, 'sine', 0.18); }
      function soundMatch() { initAudio(); playTone(523, 0.1, 'sine', 0.25, 0); playTone(659, 0.1, 'sine', 0.25, 0.1); playTone(784, 0.12, 'sine', 0.2, 0.2); }
      function soundError() { initAudio(); playTone(180, 0.15, 'triangle', 0.12); }
      function soundWin() {
        initAudio();
        [523, 659, 784, 1047].forEach((f, i) => playTone(f, 0.15, 'sine', 0.3, i * 0.1));
      }

      // ==================== Utility Functions ====================
      function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m}:${s.toString().padStart(2, '0')}`;
      }

      function updateStatsDisplay() {
        attemptsDisplay.textContent = attempts.toLocaleString('fa-IR');
        errorsDisplay.textContent = errors.toLocaleString('fa-IR');
        const left = PAIRS_PER_GAME - matchedPairs.size;
        pairsLeftDisplay.textContent = left.toLocaleString('fa-IR');
      }

      function calculateScore() {
        return Math.max(0, 5000 - (errors * 70) - (timerSeconds * 4));
      }

      // ==================== LocalStorage Best Score ====================
      function getBestScore() {
        try {
          return parseInt(localStorage.getItem('memoryGameBestScore')) || 0;
        } catch (e) { return 0; }
      }
      function setBestScore(score) {
        try {
          const current = getBestScore();
          if (score > current) {
            localStorage.setItem('memoryGameBestScore', score);
            return true;
          }
          return false;
        } catch (e) { return false; }
      }

      // ==================== Card Rendering ====================
      function buildCardsFromActivities(activities) {
        const cards = [];
        activities.forEach(act => {
          // Text card
          cards.push({
            pairId: act.id,
            type: 'text',
            title: act.title,
            desc: act.desc,
            img: null
          });
          // Image card
          cards.push({
            pairId: act.id,
            type: 'image',
            title: act.title,
            desc: act.desc,
            img: act.img
          });
        });
        return cards;
      }

      function renderGameGrid(cards) {
        gameGrid.innerHTML = '';
        cards.forEach((card, index) => {
          const container = document.createElement('div');
          container.className = 'card-container';
          container.dataset.pairId = card.pairId;
          container.dataset.type = card.type;
          container.dataset.index = index;
          container.style.animationDelay = `${index * 0.05}s`;

          const cardDiv = document.createElement('div');
          cardDiv.className = 'card';

          // Back face
          const back = document.createElement('div');
          back.className = 'card-face card-back';
          back.innerHTML = generateCardBackSVG();

          // Front face
          const front = document.createElement('div');
          front.className = 'card-face card-front';
          if (card.type === 'image') {
            front.innerHTML = `
              <div class="card-image-wrapper">
                <img src="source/${card.img}" alt="${card.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'padding:12px;color:#888;\\'>📷<br>تصویر در دسترس نیست</div>'">
              </div>
              <div class="card-title">${card.title}</div>
              <div class="card-desc">${card.desc}</div>
            `;
          } else {
            front.innerHTML = `
              <div class="card-title" style="font-size:1.2rem; flex:1; display:flex; align-items:center; justify-content:center;">${card.title}</div>
              <div class="card-desc">${card.desc}</div>
            `;
          }

          cardDiv.appendChild(back);
          cardDiv.appendChild(front);
          container.appendChild(cardDiv);

          container.addEventListener('click', (e) => handleCardClick(container, e));
          gameGrid.appendChild(container);
        });
      }

      // ==================== Card Interaction ====================
      function getCardElement(container) {
        return container.querySelector('.card');
      }

      function isCardFlipped(container) {
        return getCardElement(container).classList.contains('flipped');
      }

      function flipCardUp(container) {
        getCardElement(container).classList.add('flipped');
      }

      function flipCardDown(container) {
        getCardElement(container).classList.remove('flipped');
      }

      function addRipple(container, event) {
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        const rect = container.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height) * 1.5;
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (event.clientX - rect.left - size / 2) + 'px';
        ripple.style.top = (event.clientY - rect.top - size / 2) + 'px';
        container.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      }

      function handleCardClick(container, event) {
        if (!gameActive || gameFinished || isPreviewActive || isChecking) return;
        if (container.classList.contains('matched')) return;
        if (isCardFlipped(container)) return;
        if (flippedCards.length >= 2) return;

        addRipple(container, event);
        soundClick();
        flipCardUp(container);
        flippedCards.push(container);

        if (flippedCards.length === 2) {
          attempts++;
          updateStatsDisplay();
          isChecking = true;
          const [cardA, cardB] = flippedCards;
          const pairIdA = cardA.dataset.pairId;
          const pairIdB = cardB.dataset.pairId;
          const typeA = cardA.dataset.type;
          const typeB = cardB.dataset.type;

          // Match condition: same pairId, different types (text + image)
          if (pairIdA === pairIdB && typeA !== typeB) {
            // Correct match
            setTimeout(() => {
              soundMatch();
              cardA.classList.add('matched');
              cardB.classList.add('matched');
              matchedPairs.add(parseInt(pairIdA));
              flippedCards = [];
              isChecking = false;
              updateStatsDisplay();
              if (matchedPairs.size === PAIRS_PER_GAME) {
                endGame(true);
              }
            }, 400);
          } else {
            // Wrong match
            errors++;
            updateStatsDisplay();
            setTimeout(() => {
              soundError();
              flipCardDown(cardA);
              flipCardDown(cardB);
              flippedCards = [];
              isChecking = false;
            }, 900);
          }
        }
      }

      // ==================== Timer ====================
      function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerSeconds = 0;
        timerDisplay.textContent = formatTime(timerSeconds);
        timerInterval = setInterval(() => {
          timerSeconds++;
          timerDisplay.textContent = formatTime(timerSeconds);
        }, 1000);
      }

      function stopTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      // ==================== Preview Phase ====================
      function startPreview() {
        isPreviewActive = true;
        gameActive = false;
        const allContainers = document.querySelectorAll('.card-container');
        allContainers.forEach(c => flipCardUp(c));
        setTimeout(() => {
          allContainers.forEach(c => {
            if (!c.classList.contains('matched')) flipCardDown(c);
          });
          isPreviewActive = false;
          gameActive = true;
          startTimer();
        }, 2800);
      }

      // ==================== Game Flow ====================
      function initGame() {
        stopTimer();
        attempts = 0;
        errors = 0;
        matchedPairs.clear();
        flippedCards = [];
        isChecking = false;
        isPreviewActive = false;
        gameActive = false;
        gameFinished = false;
        timerSeconds = 0;
        timerDisplay.textContent = formatTime(0);
        updateStatsDisplay();

        // Randomly pick 4 activities
        const shuffledActs = shuffleArray(allActivities);
        const selected = shuffledActs.slice(0, PAIRS_PER_GAME);
        cardsData = shuffleArray(buildCardsFromActivities(selected));

        renderGameGrid(cardsData);
        // Start preview after a tiny delay for rendering
        setTimeout(() => startPreview(), 200);
      }

      function endGame(won = true) {
        gameFinished = true;
        gameActive = false;
        stopTimer();
        const score = calculateScore();
        const isNewBest = setBestScore(score);
        const bestEver = getBestScore();

        if (won) {
          finalScoreEl.textContent = score.toLocaleString('fa-IR');
          finalErrorsEl.textContent = errors.toLocaleString('fa-IR');
          finalTimeEl.textContent = formatTime(timerSeconds);
          bestRecordDisplay.innerHTML = isNewBest ? 
            `🎉 رکورد جدید! ${score.toLocaleString('fa-IR')}` : 
            `🏅 بهترین رکورد: ${bestEver.toLocaleString('fa-IR')}`;
          
          setTimeout(() => {
            endOverlay.classList.add('active');
            soundWin();
            spawnConfetti();
          }, 600);
        }
      }

      // ==================== Confetti ====================
      function spawnConfetti() {
        const colors = ['#c9a84c','#e0c878','#1a4a2a','#2ecc71','#f1c40f','#e74c3c','#3498db','#9b59b6'];
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < 120; i++) {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.style.left = Math.random() * 100 + '%';
          piece.style.top = -(Math.random() * 40 + 10) + 'px';
          piece.style.width = (Math.random() * 8 + 5) + 'px';
          piece.style.height = (Math.random() * 8 + 5) + 'px';
          piece.style.background = colors[Math.floor(Math.random() * colors.length)];
          piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          piece.style.animationDuration = (Math.random() * 2.5 + 2) + 's';
          piece.style.animationDelay = Math.random() * 1.2 + 's';
          fragment.appendChild(piece);
        }
        confettiContainer.appendChild(fragment);
        setTimeout(() => { confettiContainer.innerHTML = ''; }, 5000);
      }

      // ==================== Event Listeners ====================
      btnStartGame.addEventListener('click', () => {
        initAudio();
        startScreen.classList.add('hidden');
        initGame();
      });

      btnReset.addEventListener('click', () => {
        initAudio();
        initGame();
        endOverlay.classList.remove('active');
      });

      btnReplay.addEventListener('click', () => {
        initAudio();
        endOverlay.classList.remove('active');
        initGame();
      });

      // Close overlay if clicked outside modal (optional)
      endOverlay.addEventListener('click', (e) => {
        if (e.target === endOverlay) {
          endOverlay.classList.remove('active');
        }
      });

      // Ensure audio context on first user interaction
      document.body.addEventListener('click', initAudio, { once: true });
      document.body.addEventListener('touchstart', initAudio, { once: true });

      // Initial state: show start screen
      // Game will be initialized after user clicks start.
      // We pre-render empty grid to avoid layout shift, but hide stats?
      // Actually we show header and empty grid behind start screen, it's fine.
      gameGrid.innerHTML = '';
      updateStatsDisplay();
    })();
  </script>
</body>
